schema_version: 3
id: local_runtime_effects
title: Local Runtime Effects
kind: experiment_group
status: planned
runner_status: implemented
run_command: uv run llm-benchmark runtime-matrix
figure_command: >-
  uv run llm-benchmark figures
  --default-experiment RUN
  --context-experiment RUN
saved_artifacts:
  - artifacts/manifest.json
  - artifacts/data/configurations.csv
  - artifacts/data/suites.csv
  - artifacts/data/benchmarks.csv
  - artifacts/data/items.csv
  - artifacts/data/plots/*.csv
  - artifacts/plots/*.png
  - artifacts/plots/*.svg
  - models/*/telemetry.jsonl
probe_sets:
  temperature: ../probes/temperature_stability_v2.yaml
  constrained_decoding: ../probes/constrained_decoding_v2.yaml
  repetition_penalty: ../probes/repetition_penalty_v2.yaml
  context: ../probes/context_speed_v2.yaml
experiments:
  - id: quantization_survival
    variants: [Q8, Q6, Q4, Q3]
    controls: [same_model_family, same_probe_version, same_generation_settings]
    metrics: [score_by_suite, quality_retained_vs_q8, peak_memory_bytes, model_file_bytes]
    required_probe_types: [large_number_arithmetic, rare_proper_nouns, long_code_identifiers, non_ascii_text, tool_use]
  - id: temperature_stability
    probe: temperature
    variants: [{temperature: 0.0}, {temperature: 0.7}]
    repetitions: 3
    metrics: [pass_rate, score_delta, run_to_run_flip_rate, output_tokens]
  - id: repetition_penalty
    probe: repetition_penalty
    variants: [{repeat_penalty: 1.0}, {repeat_penalty: 1.1}]
    metrics: [pass_rate, score_delta, repetition_rate, output_tokens]
  - id: long_generation_degradation
    variants: [structured_output_1500_plus_tokens]
    metrics: [overall_format_accuracy, final_third_format_accuracy, repetition_rate]
  - id: context_overflow
    variants: [context_90_percent, context_100_percent, context_110_percent]
    metrics: [early_instruction_retention, completion_status, truncation_rate]
  - id: constrained_decoding_tradeoff
    probe: constrained_decoding
    variants: [plain_generation, json_mode_or_grammar]
    metrics: [parseability, value_accuracy, latency_seconds]
  - id: runner_regression
    variants: [engine_version]
    controls: [same_model_file, same_probe_version, same_settings]
    metrics: [score_delta, latency_delta, memory_delta, integration_friction_delta]

final_figures:
  status: simplified_after_evidence_review
  default_configuration:
    temperature: 0.0
    top_p: 1.0
    top_k: 40
    repeat_penalty: 1.0
    constrained_decoding: none
    context_window: 16384
    batch_size: 512
    gpu_layers: -1
    flash_attention: true
    seed: 42
    repetitions: 1
  model_families:
    qwen2_5: {architecture: qwen2.5-3b, color: '#1565C0'}
    gemma3: {architecture: gemma-3-4b, color: '#D32F2F'}
    qwen3: {architecture: qwen3-8b, color: '#2E7D32'}
  quantizations: [Q8, Q6, Q4, Q3]
  required:
    - quant_applied_reasoning
    - quant_code_debug_repair
    - quant_messy_text_to_schema
    - quant_raw_output_discipline
    - quant_tool_trace_parseability
    - constraint_load_score
    - constraint_content_retention
    - context_ttft
  reporting:
    one_metric_per_figure: true
    marker_shapes_encode_data: false
    family_colors: [blue, red, green]
    quantization_metric: benchmark_mean_score
    constraint_configuration: Q4
    context_metric: median_ttft_seconds
    outputs: [csv, png, svg]

to_be_investigated_benchmarks:
  tool_use_correctness:
    issue: Expected observations are not produced by real tool execution, and final states are compared too strictly.
    next_step: Add simulated tool execution and semantic final-state checks before plotting correctness.
  temperature_effects:
    issue: Temperature 0 has one response per prompt while temperature 0.7 has three repetitions.
    next_step: Run three matched repetitions at both temperatures before publishing benchmark deltas.
  answer_stability_follow_ups:
    issue: Paired transitions are added after results.jsonl is written, and each follow-up condition has only three pairs per configuration.
    next_step: Persist paired transitions and expand the follow-up set before plotting flip rates.
  long_text_retrieval:
    issue: Every current accuracy cell is 3 out of 3, so the probe has no separating power.
    next_step: Add harder retrieval cases and more examples; keep current data only for context timing.
  confidence_calibration:
    issue: Confidence bins contain zero to four observations instead of the required thirty.
    next_step: Expand confidence questions before generating calibration plots.
  thermal_drift:
    issue: Question order, prompt length, and output length are confounded with run order.
    next_step: Use repeated fixed probes with shuffled or interleaved ordering before making thermal claims.
  constraint_load_absolute_scores:
    issue: The degradation trend is useful, but one-constraint absolute scores are unexpectedly low.
    next_step: Manually audit content-preservation and rule-compliance checks before interpreting absolute levels.
  shuffled_choices_q3:
    issue: Qwen3 falls by 25 score points at Q3 on only twenty questions.
    next_step: Inspect the failures and expand the set before claiming quantization-driven position bias.
