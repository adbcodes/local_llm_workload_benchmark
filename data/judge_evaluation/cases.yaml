  # Hard semantic cases model longer, noisier answers seen in real benchmark runs.
  - id: semantic_long_all_requirements_correct
    route: semantic_requirements
    category: long_form
    task: Recommend whether the migration should proceed after backup verification failed. Include the reason, customer communication, and next step.
    candidate: |-
      The migration window was prepared correctly and the application checks completed successfully. Those positive checks do not remove the dependency on a verified backup, however. Because the backup verification failed, proceeding would leave the team without a confirmed recovery point if the migration caused data corruption.

      The migration should therefore be postponed. Customers affected by the delay should be notified that the maintenance window is being rescheduled, without suggesting that their existing data has been lost. The team should investigate the verification failure, create and verify a new backup, and retry the migration tomorrow only after that verification succeeds.
    requirements:
      core_fact:decision: Recommend postponing the migration because backup verification failed.
      communication: State that affected customers should be notified about the rescheduled maintenance.
      next_step: State that the team should verify a new backup before retrying tomorrow.
    semantic_gold:
      overall_correct: true
      ambiguous: false
      requirements:
        core_fact:decision: {satisfied: true, contradicted: false}
        communication: {satisfied: true, contradicted: false}
        next_step: {satisfied: true, contradicted: false}

  - id: semantic_long_late_reversal
    route: semantic_requirements
    category: long_form
    task: Recommend whether the migration should proceed after backup verification failed. Include the reason and next step.
    candidate: |-
      Backup verification is an important safety gate because it confirms that a usable recovery point exists. Its failure creates a meaningful risk, and under ordinary circumstances the migration would be postponed while the team creates and verifies another backup. Retrying tomorrow after a successful verification would be the cautious option.

      Nevertheless, the maintenance window is difficult to obtain and most other checks passed. On balance, my final recommendation is to proceed with the migration now and accept the backup risk rather than delay the release.
    requirements:
      core_fact:decision: Recommend postponing the migration because backup verification failed.
      next_step: State that the team should verify a new backup before retrying tomorrow.
    semantic_gold:
      overall_correct: false
      ambiguous: false
      requirements:
        core_fact:decision: {satisfied: false, contradicted: true}
        next_step: {satisfied: false, contradicted: true}

  - id: semantic_long_quoted_opposite_refuted
    route: semantic_requirements
    category: discourse
    task: State whether the rollout should proceed after the rollback test failed.
    candidate: |-
      One engineer argued, "We should proceed because the deployment tests passed." That statement describes the argument made in the meeting; it is not my recommendation. Deployment success does not compensate for the inability to recover safely.

      My recommendation is to stop the rollout. The rollback test failed, so the team should repair and rerun that test before scheduling another attempt.
    requirements:
      core_fact:decision: State that the rollout should not proceed because the rollback test failed.
    semantic_gold:
      overall_correct: true
      ambiguous: false
      requirements:
        core_fact:decision: {satisfied: true, contradicted: false}

  - id: semantic_long_explicit_self_correction
    route: semantic_requirements
    category: discourse
    task: Decide whether invoice INV-204 should be marked paid when the bank transfer was reversed.
    candidate: |-
      My initial reading was that INV-204 could be marked paid because a transfer appears in the payment history. That conclusion was premature. The later bank entry shows that the transfer was reversed, which means the funds were not retained.

      I withdraw the initial conclusion. The final decision is that INV-204 must remain unpaid until a replacement payment clears.
    requirements:
      core_fact:payment: State that INV-204 must remain unpaid because the bank transfer was reversed.
    semantic_gold:
      overall_correct: true
      ambiguous: false
      requirements:
        core_fact:payment: {satisfied: true, contradicted: false}

  - id: semantic_long_conditional_nonanswer
    route: semantic_requirements
    category: ambiguity
    task: The rollback test failed. State whether the rollout should proceed.
    candidate: |-
      There are two reasonable paths. If the rollback test passed, proceeding would preserve the release schedule and avoid another maintenance window. If the rollback test failed, delaying would reduce recovery risk. Teams often weigh those outcomes differently depending on urgency, customer impact, and operational confidence.

      Either proceeding or delaying could therefore be justified. I do not have a definite recommendation.
    requirements:
      core_fact:decision: State that the rollout should not proceed because the rollback test failed.
    semantic_gold:
      overall_correct: false
      ambiguous: false
      requirements:
        core_fact:decision: {satisfied: false, contradicted: false}

