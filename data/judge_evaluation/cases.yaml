    candidate: |-
      The failed backup verification means the team does not currently have a confirmed recovery point. Even though the application checks passed and the maintenance window is already open, that recovery risk is more important than keeping the original schedule. The migration should be postponed.

      The engineering team should diagnose the failure, produce another backup, verify that it can be restored, and retry tomorrow only if those checks succeed. This approach protects the data while keeping the delay limited to the shortest practical period.
    requirements:
      core_fact:decision: Recommend postponing the migration because backup verification failed.
      communication: State that affected customers should be notified about the rescheduled maintenance.
      next_step: State that the team should verify a new backup before retrying tomorrow.
    semantic_gold:
      overall_correct: false
      ambiguous: false
      requirements:
        core_fact:decision: {satisfied: true, contradicted: false}
        communication: {satisfied: false, contradicted: false}
        next_step: {satisfied: true, contradicted: false}

  - id: semantic_long_correct_with_irrelevant_detail
    route: semantic_requirements
    category: long_form
    task: Explain why rate limiting is useful. Mention overload protection and fair access.
    candidate: |-
      APIs are used by mobile applications, browser clients, internal services, scheduled jobs, and third-party integrations. Those clients can behave differently, and a temporary retry loop can produce much more traffic than its author intended. Teams may implement limits with fixed windows, sliding windows, token buckets, or other algorithms, depending on their infrastructure.

      Regardless of the algorithm, rate limiting caps how much traffic a client can send during a period so that sudden request volume does not overwhelm the service. Applying the policy consistently also prevents one aggressive client from consuming all available capacity, leaving fair access for everyone else.
    requirements:
      core_fact:overload: Explain that rate limiting protects the service from overload.
      fairness: Explain that rate limiting helps keep access fair among clients.
    semantic_gold:
      overall_correct: true
      ambiguous: false
      requirements:
        core_fact:overload: {satisfied: true, contradicted: false}
        fairness: {satisfied: true, contradicted: false}

