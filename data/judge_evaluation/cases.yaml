  # Blind extraction: the judge never sees the task or reference answer.
  - id: extract_numeric_explanation
    route: blind_extraction
    category: numeric
    candidate: The answer is 145 (100 + 45).
    response_type: number
    response_format: 'FINAL: <number>'
    scoring_method: numeric_tolerance
    gold_value: 145
    extraction_gold: {status: extracted, accepted_answers: ['145', '145.0']}

  - id: extract_numeric_unit
    route: blind_extraction
    category: numeric
    candidate: After multiplying 0.175 by 640, I get 112 kg.
    response_type: number
    response_format: 'FINAL: <number> kg'
    scoring_method: numeric_tolerance
    gold_value: 112
    scoring_parameters: {answer_unit: kg}
    extraction_gold: {status: extracted, accepted_answers: [112 kg, 112.0 kg]}

