    category: paraphrase
    task: Explain why API rate limiting is useful.
    candidate: Request caps stop a service from being overwhelmed and give clients equitable access.
    requirements:
      core_fact:purpose: Explain that rate limiting protects a service from overload.
      fairness: Explain that it helps keep access fair among clients.
    semantic_gold:
      overall_correct: true
      ambiguous: false
      requirements:
        core_fact:purpose: {satisfied: true, contradicted: false}
        fairness: {satisfied: true, contradicted: false}

