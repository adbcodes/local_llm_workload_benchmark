  - id: extract_long_reasoning_final_at_end
    route: blind_extraction
    category: long_extraction
    candidate: |-
      I calculated the base allocation first. The three existing groups contribute 36 units, and the temporary group contributes another 18, giving 54 before exclusions. I initially subtracted 11 because that value appears in the notes, but it belongs to a different reporting period and should not be used. The applicable exclusions are 7 and 2, so the correct subtraction is 9. That leaves 45 units. I checked the arithmetic a second time: 36 + 18 = 54, and 54 - 9 = 45. The earlier value of 43 was only an intermediate result produced by using the wrong exclusion. FINAL: 45 units
    response_type: number
    response_format: 'FINAL: <number> units'
    scoring_method: numeric_tolerance
    gold_value: 45
    scoring_parameters: {answer_unit: units}
    extraction_gold: {status: extracted, accepted_answers: [45 units, 45.0 units]}

  - id: extract_long_multiple_drafts_then_correction
    route: blind_extraction
    category: long_extraction
    candidate: |-
      The first candidate label was cache_expiry because the report mentioned stale data after several minutes. Looking more carefully, expiry is functioning as configured and the stale value appears only after a write. I then considered stale_replica, but every read in the trace is served by the primary instance. The decisive evidence is that the write path updates storage without deleting the corresponding cached key. Therefore the earlier labels should be disregarded. My final diagnosis is cache_invalidation.
    response_type: text
    response_format: diagnosis_label
    scoring_method: exact_match
    gold_value: cache_invalidation
    scoring_parameters: {case_sensitive: false}
    extraction_gold:
      status: extracted
      accepted_answers: [cache_invalidation, CACHE_INVALIDATION]

  - id: extract_long_repetition_without_claim
    route: blind_extraction
    category: repetition
    candidate: |-
      Working notes only. A could be before B. A could be after B. C may occupy the third position. Start again: A could be before B. A could be after B. C may occupy the third position. Start again: A could be before B. A could be after B. C may occupy the third position. Start again: A could be before B. A could be after B. C may occupy the third position. The arrangement has not been resolved, and I do not have a final answer.
    response_type: text
    response_format: comma_separated_labels
    scoring_method: exact_match
    gold_value: A,B,C
    scoring_parameters: {case_sensitive: false}
    extraction_gold: {status: no_answer}

  - id: extract_long_conflicting_answers_unresolved
    route: blind_extraction
    category: repetition
    candidate: |-
      One calculation gives 112 because 0.175 multiplied by 640 equals 112. A separate interpretation gives 145 after adding the two reported groups. Rechecking the source does not establish which interpretation the question intended. The first path therefore supports 112, while the second supports 145. Neither result supersedes the other, and I cannot select a final value between 112 and 145.
    response_type: number
    response_format: 'FINAL: <number>'
    scoring_method: numeric_tolerance
    gold_value: 112
    extraction_gold: {status: ambiguous}

  - id: extract_long_coding_diagnosis
    route: blind_extraction
    category: coding_diagnosis
    candidate: |-
      The request handler reads the cached group membership before processing the update. The database transaction correctly inserts the new member and commits successfully, so this is not a transaction rollback or validation problem. The following read still returns the old list because the cache entry remains populated. Restarting the process appears to fix the issue only because it clears that entry. The appropriate repair is to invalidate or refresh the group-members cache after a successful mutation. In the benchmark's requested label vocabulary, the final diagnosis is stale_cache.
    response_type: text
    response_format: diagnosis_label
    scoring_method: exact_match
    gold_value: stale_cache
    scoring_parameters: {case_sensitive: false}
    extraction_gold: {status: extracted, accepted_answers: [stale_cache, STALE_CACHE]}

