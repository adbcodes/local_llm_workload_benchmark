id: knowledge_abstention
title: Knowledge and Abstention
description: Answer supported facts, reject fabrications, abstain when evidence is missing, and ask for clarification.
suite: A
status: started
execution_mode: single_turn
task_types:
- answerable facts with a stated cutoff
- fabricated APIs and events
- unanswerable questions
- ambiguous questions requiring clarification
metrics:
- accuracy
- hallucination_rate
- abstention_accuracy
- clarification_accuracy
score_formula: accuracy_minus_hallucination
items_path: items.jsonl
authoring_paths:
- questions.yaml
current_question_count: 30
target_question_count: 30
current_difficulty_distribution:
  easy: 10
  medium: 15
  hard: 5
difficulty_distribution:
  easy: 10
  medium: 15
  hard: 5
target_visibility_distribution:
  public: 15
  held_out: 15
order_rule: easy_to_hard
scoring_methods:
- exact_match
- behavior_rules
