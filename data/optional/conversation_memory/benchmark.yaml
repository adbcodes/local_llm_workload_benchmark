id: conversation_memory
title: Conversation Memory
description: Retain facts, preferences, corrections, and formats across five and ten turns.
suite: E
status: started
execution_mode: multi_turn
task_types:
- fact retention
- format retention
- preference retention
- correction retention
- turn-5 probes
- turn-10 probes
metrics:
- turn_5_accuracy
- turn_10_accuracy
- retained_score
score_formula: clean_score_retained
evaluation_policy:
  primary_outcome: semantic
  primary_metric: semantic_pass_rate
  protocol_requirement: diagnostic
  partial_credit_metric: mean_semantic_score
items_path: items.jsonl
authoring_paths:
- questions.yaml
current_question_count: 20
target_question_count: 20
current_difficulty_distribution:
  easy: 5
  medium: 10
  hard: 5
difficulty_distribution:
  easy: 5
  medium: 10
  hard: 5
target_visibility_distribution:
  public: 10
  held_out: 10
order_rule: easy_to_hard
scoring_methods:
- exact_match
- json_exact
- constraint_rules
