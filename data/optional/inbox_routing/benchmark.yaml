id: inbox_routing
title: Inbox Routing
description: Route clear, ambiguous, urgent, multi-topic, and out-of-scope messages.
suite: B
status: started
execution_mode: single_turn
task_types:
- single-label routing
- multi-label routing
- urgency under polite tone
- ask-for-more-information cases
- out-of-scope messages
metrics:
- label_accuracy
- multilabel_jaccard
- urgency_accuracy
- clarification_accuracy
score_formula: mean_score
evaluation_policy:
  primary_outcome: semantic
  primary_metric: semantic_pass_rate
  protocol_requirement: diagnostic
  partial_credit_metric: mean_semantic_score
items_path: items.jsonl
authoring_paths:
- questions.yaml
current_question_count: 30
target_question_count: 30
current_difficulty_distribution:
  easy: 8
  medium: 15
  hard: 7
difficulty_distribution:
  easy: 8
  medium: 15
  hard: 7
target_visibility_distribution:
  public: 15
  held_out: 15
order_rule: easy_to_hard
scoring_methods:
- set_match
- behavior_rules
