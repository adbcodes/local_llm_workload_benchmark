schema_version: 1
benchmark: code_debug_repair
items:
  - id: code_deduplicate_001
    subcategory: function_implementation
    difficulty: easy
    split: dev
    prompt: >-
      Implement a Python function named deduplicate_preserving_order(values).
      It must return a new list containing the first occurrence of each value in
      input order. The input contains only integers and strings. Treat values
      using normal Python equality. Do not mutate the input. Return only the
      function definition, with no imports, Markdown, examples, or explanation.
    response_contract:
      type: code
      format: python_function
    expected:
      value:
        entry_point: deduplicate_preserving_order
        tests:
          - args: [[1, 2, 1, 3, 2]]
            expected: [1, 2, 3]
          - args: [[a, b, a, c]]
            expected: [a, b, c]
          - args: [[]]
            expected: []
          - args: [[1, "1", 1, "1"]]
            expected: [1, "1"]
    scoring:
      method: executable_python
      parameters:
        timeout_seconds: 1.0
        memory_limit_mb: 128
        max_output_characters: 10000
    provenance:
      kind: hand_authored
      review_status: human_checked
    tags: [python, function_implementation, unit_tests, pass_at_1]
