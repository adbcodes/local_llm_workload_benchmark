  - id: repair_shortest_hops_001
    subcategory: code_repair
    difficulty: hard
    split: test
    prompt: |-
      Repair this shortest-path function. It uses a stack, so it can return a
      non-minimal path in an unweighted graph:

      def shortest_hops(n, edges, start, end):
          graph = [[] for _ in range(n)]
          for a, b in edges:
              graph[a].append(b); graph[b].append(a)
          pending = [(start, 0)]
          seen = set()
          while pending:
              node, distance = pending.pop()
              if node == end: return distance
              if node in seen: continue
              seen.add(node)
              for neighbor in graph[node]:
                  pending.append((neighbor, distance + 1))
          return -1

      Return only the corrected shortest_hops function definition and use no imports.
    response_contract: {type: code, format: python_function}
    expected:
      value:
        entry_point: shortest_hops
        tests:
          - {args: [6, [[0, 1], [1, 2], [0, 3], [3, 4], [4, 5], [5, 2]], 0, 2], expected: 2}
          - {args: [4, [[0, 1]], 0, 3], expected: -1}
          - {args: [3, [[0, 1], [1, 2]], 2, 2], expected: 0}
          - {args: [5, [[0, 1], [0, 2], [2, 3], [3, 4], [1, 4]], 0, 4], expected: 2}
    scoring: *executable_scoring
    provenance: *provenance
    tags: [dsa, repair, graph, breadth_first_search, pass_at_1]

  - id: repair_course_order_001
    subcategory: code_repair
    difficulty: hard
    split: test
    prompt: |-
      Repair this prerequisite checker. It increments indegree for the prerequisite
      instead of the dependent course:

      def can_finish(course_count, prerequisites):
          graph = [[] for _ in range(course_count)]
          indegree = [0] * course_count
          for course, prerequisite in prerequisites:
              graph[prerequisite].append(course)
              indegree[prerequisite] += 1
          queue = [i for i in range(course_count) if indegree[i] == 0]
          completed = 0
          while queue:
              node = queue.pop(0)
              completed += 1
              for neighbor in graph[node]:
                  indegree[neighbor] -= 1
                  if indegree[neighbor] == 0: queue.append(neighbor)
          return completed == course_count

      Return only the corrected can_finish function definition and use no imports.
    response_contract: {type: code, format: python_function}
    expected:
      value:
        entry_point: can_finish
        tests:
          - {args: [2, [[1, 0]]], expected: true}
          - {args: [2, [[1, 0], [0, 1]]], expected: false}
          - {args: [4, [[1, 0], [2, 1], [3, 2]]], expected: true}
          - {args: [5, [[1, 0], [2, 0], [3, 1], [1, 3]]], expected: false}
    scoring: *executable_scoring
    provenance: *provenance
    tags: [dsa, repair, graph, topological_sort, pass_at_1]
