  - {"id":"code_parse_feature_flags_001","subcategory":"function_implementation","difficulty":"easy","split":"test","visibility":"held_out","prompt":"Complete a small utility used by a repository configuration loader.\n\nFunction: parse_feature_flags(lines)\nContract: Ignore blank and # comment lines. Parse NAME=on/off case-insensitively, trim both sides, and let later entries win. Return a dictionary of booleans.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"parse_feature_flags","tests":[{"args":[["A=on","B=off","A=off"]],"expected":{"A":false,"B":false},"preserve_args":[0]},{"args":[[" # note"," X = ON "]],"expected":{"X":true},"preserve_args":[0]},{"args":[[]],"expected":{},"preserve_args":[0]},{"args":[["cache=off"]],"expected":{"cache":false},"preserve_args":[0]}],"reference_solution":"def parse_feature_flags(lines):\n    result = {}\n    for line in lines:\n        text = line.strip()\n        if not text or text.startswith('#'):\n            continue\n        key, value = text.split('=', 1)\n        result[key.strip()] = value.strip().lower() == 'on'\n    return result"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","sanity","parsing"]}
  - {"id":"code_apply_profile_patch_001","subcategory":"function_implementation","difficulty":"easy","split":"test","visibility":"public","prompt":"A regression-safe change in a small internal Python service requires this helper.\n\nFunction: apply_profile_patch(profile, patch)\nContract: Return a new profile with patch values applied; a None patch value deletes that key. Preserve the original inputs.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"apply_profile_patch","tests":[{"args":[{"a":1,"b":2},{"b":3,"a":null}],"expected":{"b":3},"preserve_args":[0,1]},{"args":[{},{"x":1}],"expected":{"x":1},"preserve_args":[0,1]},{"args":[{"x":1},{}],"expected":{"x":1},"preserve_args":[0,1]},{"args":[{"x":1},{"missing":null}],"expected":{"x":1},"preserve_args":[0,1]}],"reference_solution":"def apply_profile_patch(profile, patch):\n    result = dict(profile)\n    for key, value in patch.items():\n        if value is None:\n            result.pop(key, None)\n        else:\n            result[key] = value\n    return result"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","sanity","immutable_update"]}
  - {"id":"code_select_latest_records_001","subcategory":"function_implementation","difficulty":"easy","split":"test","visibility":"held_out","prompt":"Implement the repository helper below for an internal records pipeline.\n\nFunction: select_latest_records(records)\nContract: For each id retain the record with the greatest integer version; equal versions keep the later input record. Return retained records ordered by id.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"select_latest_records","tests":[{"args":[[{"id":"b","version":1},{"id":"a","version":2},{"id":"b","version":3}]],"expected":[{"id":"a","version":2},{"id":"b","version":3}],"preserve_args":[0]},{"args":[[{"id":"a","version":1,"v":"x"},{"id":"a","version":1,"v":"y"}]],"expected":[{"id":"a","version":1,"v":"y"}],"preserve_args":[0]},{"args":[[]],"expected":[],"preserve_args":[0]},{"args":[[{"id":"x","version":0}]],"expected":[{"id":"x","version":0}],"preserve_args":[0]}],"reference_solution":"def select_latest_records(records):\n    latest = {}\n    for record in records:\n        key = record['id']\n        if key not in latest or record['version'] >= latest[key]['version']:\n            latest[key] = dict(record)\n    return [latest[key] for key in sorted(latest)]"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","sanity","records"]}
  - {"id":"code_bucket_response_times_001","subcategory":"function_implementation","difficulty":"easy","split":"dev","visibility":"public","prompt":"A maintenance ticket for a small internal Python service needs this missing helper.\n\nFunction: bucket_response_times(values, limits)\nContract: Return counts for len(limits)+1 buckets. Bucket i contains values greater than the previous limit and less than or equal to limits[i]; the final bucket is above the last limit. Limits are sorted.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"bucket_response_times","tests":[{"args":[[1,5,6,10,11],[5,10]],"expected":[2,2,1],"preserve_args":[0,1]},{"args":[[],[2]],"expected":[0,0],"preserve_args":[0,1]},{"args":[[3,3],[3]],"expected":[2,0],"preserve_args":[0,1]},{"args":[[1,9],[]],"expected":[2],"preserve_args":[0,1]}],"reference_solution":"def bucket_response_times(values, limits):\n    counts = [0] * (len(limits) + 1)\n    for value in values:\n        index = 0\n        while index < len(limits) and value > limits[index]:\n            index += 1\n        counts[index] += 1\n    return counts"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","sanity","boundaries"]}
  - {"id":"code_mask_record_fields_001","subcategory":"function_implementation","difficulty":"easy","split":"test","visibility":"held_out","prompt":"Complete a small utility used by a small internal Python service.\n\nFunction: mask_record_fields(records, fields)\nContract: Return new records, replacing each present named field with '***'. Preserve record order and both inputs.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"mask_record_fields","tests":[{"args":[[{"name":"Ada","email":"a@x"}],["email"]],"expected":[{"name":"Ada","email":"***"}],"preserve_args":[0,1]},{"args":[[{"a":1},{"b":2}],["x"]],"expected":[{"a":1},{"b":2}],"preserve_args":[0,1]},{"args":[[],["x"]],"expected":[],"preserve_args":[0,1]},{"args":[[{"token":"z"}],[]],"expected":[{"token":"z"}],"preserve_args":[0,1]}],"reference_solution":"def mask_record_fields(records, fields):\n    hidden = set(fields)\n    return [{key: ('***' if key in hidden else value) for key, value in record.items()} for record in records]"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","sanity","immutable_update"]}
  - {"id":"code_parse_measurements_001","subcategory":"function_implementation","difficulty":"easy","split":"test","visibility":"public","prompt":"A regression-safe change in a repository configuration loader requires this helper.\n\nFunction: parse_measurements(lines)\nContract: Parse name:value lines, ignore malformed lines, trim names, convert values to integers, and let later valid entries win. Return keys sorted in a dictionary.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"parse_measurements","tests":[{"args":[["b:2","bad","a: 1","b:3"]],"expected":{"a":1,"b":3},"preserve_args":[0]},{"args":[[]],"expected":{},"preserve_args":[0]},{"args":[["x:no","x:-4"]],"expected":{"x":-4},"preserve_args":[0]},{"args":[[":3","z:0"]],"expected":{"z":0},"preserve_args":[0]}],"reference_solution":"def parse_measurements(lines):\n    values = {}\n    for line in lines:\n        if ':' not in line:\n            continue\n        name, raw = line.split(':', 1)\n        name = name.strip()\n        raw = raw.strip()\n        if name and raw.lstrip('-').isdigit():\n            values[name] = int(raw)\n    return {key: values[key] for key in sorted(values)}"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","sanity","parsing"]}
  - {"id":"code_reconcile_windows_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"held_out","prompt":"Implement the repository helper below for a small internal Python service.\n\nFunction: reconcile_windows(windows, blocked, minimum)\nContract: Merge overlapping or touching half-open windows, subtract every blocked half-open interval, discard pieces shorter than minimum, and return pieces ordered by start.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"reconcile_windows","tests":[{"args":[[[1,5],[4,9]],[[3,4],[7,8]],2],"expected":[[1,3],[4,7]],"preserve_args":[0,1]},{"args":[[[5,8],[1,3],[3,5]],[],3],"expected":[[1,8]],"preserve_args":[0,1]},{"args":[[],[[1,2]],1],"expected":[],"preserve_args":[0,1]},{"args":[[[0,10]],[[-1,20]],1],"expected":[],"preserve_args":[0,1]}],"reference_solution":"def reconcile_windows(windows, blocked, minimum):\n    merged = []\n    for start, end in sorted(windows):\n        if merged and start <= merged[-1][1]:\n            merged[-1][1] = max(merged[-1][1], end)\n        else:\n            merged.append([start, end])\n    pieces = merged\n    for cut_start, cut_end in blocked:\n        updated = []\n        for start, end in pieces:\n            if cut_end <= start or cut_start >= end:\n                updated.append([start, end])\n            else:\n                if start < cut_start:\n                    updated.append([start, cut_start])\n                if cut_end < end:\n                    updated.append([cut_end, end])\n        pieces = updated\n    return [piece for piece in pieces if piece[1] - piece[0] >= minimum]"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","intervals","composed_operations"]}
  - {"id":"code_session_summaries_001","subcategory":"function_implementation","difficulty":"medium","split":"dev","visibility":"public","prompt":"A maintenance ticket for an event-consumer worker needs this missing helper.\n\nFunction: session_summaries(events, gap)\nContract: Events are [user,time] pairs sorted by time. A new session starts when the gap from that user's previous event is greater than gap. Return [user,start,end,count] sessions ordered by start then user.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"session_summaries","tests":[{"args":[[["a",1],["b",2],["a",4],["a",10]],3],"expected":[["a",1,4,2],["b",2,2,1],["a",10,10,1]],"preserve_args":[0]},{"args":[[],2],"expected":[],"preserve_args":[0]},{"args":[[["x",1],["x",3]],2],"expected":[["x",1,3,2]],"preserve_args":[0]},{"args":[[["b",1],["a",1]],0],"expected":[["a",1,1,1],["b",1,1,1]],"preserve_args":[0]}],"reference_solution":"def session_summaries(events, gap):\n    active = {}\n    result = []\n    for user, time in events:\n        if user not in active or time - active[user][1] > gap:\n            if user in active:\n                result.append([user] + active[user])\n            active[user] = [time, time, 1]\n        else:\n            active[user][1] = time\n            active[user][2] += 1\n    for user, data in active.items():\n        result.append([user] + data)\n    return sorted(result, key=lambda row: (row[1], row[0]))"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","event_processing","state_tracking"]}
  - {"id":"code_dependency_batches_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"held_out","prompt":"Complete a small utility used by an internal workflow service.\n\nFunction: dependency_batches(jobs, dependencies)\nContract: Return deterministic execution batches for jobs. Each [job, prerequisite] edge requires the prerequisite first; each batch contains all currently available jobs sorted. Return [] if a cycle exists.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"dependency_batches","tests":[{"args":[["build","test","ship"],[["test","build"],["ship","test"]]],"expected":[["build"],["test"],["ship"]],"preserve_args":[0,1]},{"args":[["a","b","c"],[["c","a"]]],"expected":[["a","b"],["c"]],"preserve_args":[0,1]},{"args":[["a","b"],[["a","b"],["b","a"]]],"expected":[],"preserve_args":[0,1]},{"args":[[],[]],"expected":[],"preserve_args":[0,1]}],"reference_solution":"def dependency_batches(jobs, dependencies):\n    remaining = {job: set() for job in jobs}\n    for job, prerequisite in dependencies:\n        remaining[job].add(prerequisite)\n    result = []\n    completed = set()\n    while len(completed) < len(jobs):\n        batch = sorted(job for job in jobs if job not in completed and remaining[job] <= completed)\n        if not batch:\n            return []\n        result.append(batch)\n        completed.update(batch)\n    return result"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","graph","deterministic_order"]}
  - {"id":"code_ledger_balances_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"public","prompt":"A regression-safe change in a back-office reconciliation job requires this helper.\n\nFunction: ledger_balances(opening, entries, voided)\nContract: Starting from opening balances, apply non-voided [entry_id,account,amount] entries in order. Return [[account,balance], ...] for every resulting nonzero account, ordered by account.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"ledger_balances","tests":[{"args":[{"a":10},[["e1","a",-3],["e2","b",4]],["e2"]],"expected":[["a",7]],"preserve_args":[0,1,2]},{"args":[{},[],[]],"expected":[],"preserve_args":[0,1,2]},{"args":[{"x":1},[["e","x",-1]],[]],"expected":[],"preserve_args":[0,1,2]},{"args":[{},[["e","b",2],["f","a",3]],[]],"expected":[["a",3],["b",2]],"preserve_args":[0,1,2]}],"reference_solution":"def ledger_balances(opening, entries, voided):\n    balances = dict(opening)\n    voided_ids = set(voided)\n    for entry_id, account, amount in entries:\n        if entry_id not in voided_ids:\n            balances[account] = balances.get(account, 0) + amount\n    return [[account, balances[account]] for account in sorted(balances) if balances[account] != 0]"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","records","reconciliation"]}
  - {"id":"code_effective_permissions_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"held_out","prompt":"Implement the repository helper below for an access and rollout policy service.\n\nFunction: effective_permissions(roles, grants, denies)\nContract: roles maps each user to role names. grants maps roles to permissions. Return each user's sorted granted permissions after removing that user's denied permissions.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"effective_permissions","tests":[{"args":[{"u":["reader","writer"]},{"reader":["read"],"writer":["read","write"]},{"u":["write"]}],"expected":{"u":["read"]},"preserve_args":[0,1,2]},{"args":[{},{},{}],"expected":{},"preserve_args":[0,1,2]},{"args":[{"b":["x"],"a":[]},{"x":["p"]},{}],"expected":{"a":[],"b":["p"]},"preserve_args":[0,1,2]},{"args":[{"u":["missing"]},{},{"u":["p"]}],"expected":{"u":[]},"preserve_args":[0,1,2]}],"reference_solution":"def effective_permissions(roles, grants, denies):\n    result = {}\n    for user, user_roles in roles.items():\n        allowed = set()\n        for role in user_roles:\n            allowed.update(grants.get(role, []))\n        allowed.difference_update(denies.get(user, []))\n        result[user] = sorted(allowed)\n    return {user: result[user] for user in sorted(result)}"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","sets","policy_resolution"]}
  - {"id":"code_has_config_cycle_001","subcategory":"function_implementation","difficulty":"medium","split":"dev","visibility":"public","prompt":"A maintenance ticket for an internal workflow service needs this missing helper.\n\nFunction: has_config_cycle(links)\nContract: links maps a configuration name to its parent name or None. Return whether any chain enters a cycle, including a self-cycle.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"has_config_cycle","tests":[{"args":[{"a":"b","b":"a"}],"expected":true,"preserve_args":[0]},{"args":[{"a":"b","b":null}],"expected":false,"preserve_args":[0]},{"args":[{}],"expected":false,"preserve_args":[0]},{"args":[{"x":"x"}],"expected":true,"preserve_args":[0]}],"reference_solution":"def has_config_cycle(links):\n    done = set()\n    for start in links:\n        seen = set()\n        node = start\n        while node is not None and node in links and node not in done:\n            if node in seen:\n                return True\n            seen.add(node)\n            node = links[node]\n        done.update(seen)\n    return False"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","graph","cycle_detection"]}
  - {"id":"code_fulfill_orders_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"held_out","prompt":"Complete a small utility used by a small internal Python service.\n\nFunction: fulfill_orders(stock, orders)\nContract: Process [order_id,sku,quantity] in order. Fulfill an order only when enough stock remains. Return [fulfilled_ids, remaining_stock] with stock keys sorted.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"fulfill_orders","tests":[{"args":[{"a":5},[["o1","a",3],["o2","a",3]]],"expected":[["o1"],{"a":2}],"preserve_args":[0,1]},{"args":[{},[["o","x",1]]],"expected":[[],{}],"preserve_args":[0,1]},{"args":[{"b":1,"a":2},[]],"expected":[[],{"a":2,"b":1}],"preserve_args":[0,1]},{"args":[{"a":2},[["o","a",2]]],"expected":[["o"],{"a":0}],"preserve_args":[0,1]}],"reference_solution":"def fulfill_orders(stock, orders):\n    remaining = dict(stock)\n    fulfilled = []\n    for order_id, sku, quantity in orders:\n        if remaining.get(sku, 0) >= quantity:\n            remaining[sku] -= quantity\n            fulfilled.append(order_id)\n    return [fulfilled, {sku: remaining[sku] for sku in sorted(remaining)}]"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","state_tracking","allocation"]}
  - {"id":"code_tiered_charge_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"public","prompt":"A regression-safe change in a small internal Python service requires this helper.\n\nFunction: tiered_charge(usage, tiers)\nContract: tiers contains [inclusive_limit, unit_price] rows with increasing limits; the final limit is None. Charge successive usage units by tier and return the integer total.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"tiered_charge","tests":[{"args":[15,[[10,2],[20,3],[null,5]]],"expected":35,"preserve_args":[1]},{"args":[0,[[null,2]]],"expected":0,"preserve_args":[1]},{"args":[10,[[10,2],[null,4]]],"expected":20,"preserve_args":[1]},{"args":[25,[[10,1],[20,2],[null,3]]],"expected":45,"preserve_args":[1]}],"reference_solution":"def tiered_charge(usage, tiers):\n    remaining = usage\n    previous = 0\n    total = 0\n    for limit, price in tiers:\n        amount = remaining if limit is None else min(remaining, limit - previous)\n        total += amount * price\n        remaining -= amount\n        if remaining == 0:\n            break\n        previous = limit\n    return total"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","arithmetic","piecewise_rules"]}
  - {"id":"code_compress_log_bursts_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"held_out","prompt":"Implement the repository helper below for an event-consumer worker.\n\nFunction: compress_log_bursts(events, gap)\nContract: Events are sorted [timestamp,message]. Merge consecutive equal messages when their timestamp gap is at most gap. Return [start,end,message,count] rows.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"compress_log_bursts","tests":[{"args":[[[1,"x"],[3,"x"],[4,"y"],[10,"y"]],2],"expected":[[1,3,"x",2],[4,4,"y",1],[10,10,"y",1]],"preserve_args":[0]},{"args":[[],1],"expected":[],"preserve_args":[0]},{"args":[[[1,"x"]],0],"expected":[[1,1,"x",1]],"preserve_args":[0]},{"args":[[[1,"x"],[2,"y"],[3,"x"]],5],"expected":[[1,1,"x",1],[2,2,"y",1],[3,3,"x",1]],"preserve_args":[0]}],"reference_solution":"def compress_log_bursts(events, gap):\n    result = []\n    for timestamp, message in events:\n        if result and result[-1][2] == message and timestamp - result[-1][1] <= gap:\n            result[-1][1] = timestamp\n            result[-1][3] += 1\n        else:\n            result.append([timestamp, timestamp, message, 1])\n    return result"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","event_processing","state_tracking"]}
