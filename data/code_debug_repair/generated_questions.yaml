  - {"id":"code_release_waves_001","subcategory":"function_implementation","difficulty":"hard","split":"test","visibility":"public","prompt":"A regression-safe change in a deployment-planning service requires this helper.\n\nFunction: release_waves(services, dependencies, blocked)\nContract: Dependencies are [service,prerequisite]. Exclude blocked services and every service transitively depending on one. Return remaining services in sorted parallel release waves, or [] for a cycle.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"release_waves","tests":[{"args":[["db","api","web"],[["api","db"],["web","api"]],[]],"expected":[["db"],["api"],["web"]],"preserve_args":[0,1,2]},{"args":[["a","b","c"],[["b","a"],["c","b"]],["a"]],"expected":[],"preserve_args":[0,1,2]},{"args":[["a","b"],[["a","b"],["b","a"]],[]],"expected":[],"preserve_args":[0,1,2]},{"args":[[],[],[]],"expected":[],"preserve_args":[0,1,2]},{"args":[["a","b","c","d"],[["b","a"],["c","a"],["d","b"]],["c"]],"expected":[["a"],["b"],["d"]],"preserve_args":[0,1,2]}],"reference_solution":"def release_waves(services, dependencies, blocked):\n    excluded = set(blocked)\n    progress = True\n    while progress:\n        progress = False\n        for service, prerequisite in dependencies:\n            if prerequisite in excluded and service not in excluded:\n                excluded.add(service)\n                progress = True\n    remaining = set(services) - excluded\n    result = []\n    done = set()\n    while remaining:\n        ready = sorted(service for service in remaining if all(prerequisite in done or prerequisite in excluded for owner, prerequisite in dependencies if owner == service))\n        if not ready:\n            return []\n        result.append(ready)\n        done.update(ready)\n        remaining.difference_update(ready)\n    return result"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","graph","dependency_propagation","batching"]}
  - {"id":"code_permission_closure_001","subcategory":"function_implementation","difficulty":"hard","split":"test","visibility":"held_out","prompt":"Implement the repository helper below for an internal workflow service.\n\nFunction: permission_closure(user_roles, inherits, grants, denies)\nContract: Roles inherit other roles through [role,parent] edges. For each user, collect transitive grants from all roles, then remove user-specific denies. Return a user-sorted dictionary of sorted permissions; cycles must terminate.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"permission_closure","tests":[{"args":[{"u":["admin"]},[["admin","reader"]],{"admin":["write"],"reader":["read"]},{"u":["write"]}],"expected":{"u":["read"]},"preserve_args":[0,1,2,3]},{"args":[{},[],{},{}],"expected":{},"preserve_args":[0,1,2,3]},{"args":[{"u":["a"]},[["a","b"],["b","a"]],{"b":["p"]},{}],"expected":{"u":["p"]},"preserve_args":[0,1,2,3]},{"args":[{"b":["x"],"a":[]},[],{"x":["z"]},{}],"expected":{"a":[],"b":["z"]},"preserve_args":[0,1,2,3]},{"args":[{"u":["editor"]},[["editor","reader"],["reader","base"]],{"base":["view"],"editor":["edit"]},{"u":[]}],"expected":{"u":["edit","view"]},"preserve_args":[0,1,2,3]}],"reference_solution":"def permission_closure(user_roles, inherits, grants, denies):\n    parents = {}\n    for role, parent in inherits:\n        parents.setdefault(role, []).append(parent)\n    result = {}\n    for user, roles in user_roles.items():\n        pending = list(roles)\n        seen = set()\n        allowed = set()\n        while pending:\n            role = pending.pop()\n            if role in seen:\n                continue\n            seen.add(role)\n            allowed.update(grants.get(role, []))\n            pending.extend(parents.get(role, []))\n        allowed.difference_update(denies.get(use