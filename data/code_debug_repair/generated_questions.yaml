hs.append(path + [neighbor])\n    return []"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","graph","tie_breaking","composed_operations"]}
