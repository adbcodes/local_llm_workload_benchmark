  - {"id":"repair_binary_search_001","subcategory":"code_repair","difficulty":"easy","split":"test","prompt":"Repair this binary search so it returns a target index or -1 and always makes\nprogress:\n\ndef binary_search(values, target):\n    low, high = 0, len(values) - 1\n    while low <= high:\n        mid = (low + high) // 2\n        if values[mid] == target:\n            return mid\n        if values[mid] < target:\n            low = mid\n        else:\n            high = mid\n    return -1\n\nReturn only the corrected binary_search function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"binary_search","tests":[{"args":[[1,3,5,7],5],"expected":2},{"args":[[1,3,5,7],4],"expected":-1},{"args":[[],1],"expected":-1},{"args":[[2],2],"expected":0}]}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"hand_authored","review_status":"human_checked"},"tags":["dsa","repair","binary_search","loop_progress","pass_at_1"],"visibility":"held_out"}
  - {"id":"repair_merge_ranges_001","subcategory":"code_repair","difficulty":"medium","split":"test","prompt":"Repair this closed-range merge function; it currently loses the final merged\nrange:\n\ndef merge_ranges(ranges):\n    if not ranges:\n        return []\n    ordered = sorted(ranges)\n    merged = []\n    current = ordered[0][:]\n    for start, end in ordered[1:]:\n        if start <= current[1]:\n            current[1] = max(current[1], end)\n        else:\n            merged.append(current)\n            current = [start, end]\n    return merged\n\nReturn only the corrected merge_ranges function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"merge_ranges","tests":[{"args":[[[1,3],[2,5],[8,9]]],"expected":[[1,5],[8,9]]},{"args":[[[1,4]]],"expected":[[1,4]]},{"args":[[]],"expected":[]},{"args":[[[1,2],[3,4]]],"expected":[[1,2],[3,4]]}]}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"hand_authored","review_status":"human_checked"},"tags":["dsa","repair","intervals","missing_finalization","pass_at_1"],"visibility":"public"}
  - {"id":"repair_sliding_window_001","subcategory":"code_repair","difficulty":"medium","split":"test","prompt":"Repair this function so it returns the shortest contiguous length with sum at\nleast target for positive values. Its window may remain invalid after one\nremoval:\n\ndef shortest_window(target, values):\n    left = 0\n    total = 0\n    best = len(values) + 1\n    for right, value in enumerate(values):\n        total += value\n        if total >= target:\n            best = min(best, right - left + 1)\n            total -= values[left]\n            left += 1\n    return 0 if best == len(values) + 1 else best\n\nReturn only the corrected shortest_window function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"shortest_window","tests":[{"args":[7,[2,3,1,2,4,3]],"expected":2},{"args":[4,[1,4,4]],"expected":1},{"args":[11,[1,1,1,1]],"expected":0},{"args":[5,[5]],"expected":1}]}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"hand_authored","review_status":"human_checked"},"tags":["dsa","repair","sliding_window","invariant","pass_at_1"],"visibility":"held_out"}
  - {"id":"repair_grid_paths_001","subcategory":"code_repair","difficulty":"medium","split":"dev","prompt":"Repair this function so each dynamic-programming row is independent:\n\ndef grid_paths(rows, cols):\n    dp = [[0] * cols] * rows\n    dp[0][0] = 1\n    for r in range(rows):\n        for c in range(cols):\n            if r: dp[r][c] += dp[r - 1][c]\n            if c: dp[r][c] += dp[r][c - 1]\n    return dp[-1][-1]\n\nrows and cols are positive. Return only the corrected grid_paths function\ndefinition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"grid_paths","tests":[{"args":[3,3],"expected":6},{"args":[1,5],"expected":1},{"args":[2,3],"expected":3},{"args":[4,2],"expected":4}]}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"hand_authored","review_status":"human_checked"},"tags":["dsa","repair","dynamic_programming","aliasing","pass_at_1"],"visibility":"public"}
  - {"id":"repair_step_ways_001","subcategory":"code_repair","difficulty":"medium","split":"test","prompt":"Repair this function. A climber can take 1 or 2 steps, but may not land on a\nforbidden step. The cache incorrectly ignores which steps are forbidden:\n\ndef count_step_ways(n, forbidden):\n    cache = {}\n    def visit(step):\n        if step == n: return 1\n        if step > n or step in forbidden: return 0\n        if n in cache: return cache[n]\n        cache[n] = visit(step + 1) + visit(step + 2)\n        return cache[n]\n    return visit(0)\n\nReturn only the corrected count_step_ways function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"count_step_ways","tests":[{"args":[4,[]],"expected":5},{"args":[4,[2]],"expected":1},{"args":[3,[1]],"expected":1},{"args":[1,[]],"expected":1}]}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"hand_authored","review_status":"human_checked"},"tags":["dsa","repair","memoization","cache_key","pass_at_1"],"visibility":"held_out"}
  - {"id":"repair_shortest_hops_001","subcategory":"code_repair","difficulty":"hard","split":"test","prompt":"Repair this shortest-path function. It uses a stack, so it can return a\nnon-minimal path in an unweighted graph:\n\ndef shortest_hops(n, edges, start, end):\n    graph = [[] for _ in range(n)]\n    for a, b in edges:\n        graph[a].append(b); graph[b].append(a)\n    pending = [(start, 0)]\n    seen = set()\n    while pending:\n        node, distance = pending.pop()\n        if node == end: return distance\n        if node in seen: continue\n        seen.add(node)\n        for neighbor in graph[node]:\n            pending.append((neighbor, distance + 1))\n    return -1\n\nReturn only the corrected shortest_hops function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"shortest_hops","tests":[{"args":[6,[[0,1],[1,2],[0,3],[3,4],[4,5],[5,2]],0,2],"expected":2},{"args":[4,[[0,1]],0,3],"expected":-1},{"args":[3,[[0,1],[1,2]],2,2],"expected":0},{"args":[5,[[0,1],[0,2],[2,3],[3,4],[1,4]],0,4],"expected":2}]}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"hand_authored","review_status":"human_checked"},"tags":["dsa","repair","graph","breadth_first_search","pass_at_1"],"visibility":"public"}
  - {"id":"repair_course_order_001","subcategory":"code_repair","difficulty":"hard","split":"test","prompt":"Repair this prerequisite checker. It increments indegree for the prerequisite\ninstead of the dependent course:\n\ndef can_finish(course_count, prerequisites):\n    graph = [[] for _ in range(course_count)]\n    indegree = [0] * course_count\n    for course, prerequisite in prerequisites:\n        graph[prerequisite].append(course)\n        indegree[prerequisite] += 1\n    queue = [i for i in range(course_count) if indegree[i] == 0]\n    completed = 0\n    while queue:\n        node = queue.pop(0)\n        completed += 1\n        for neighbor in graph[node]:\n            indegree[neighbor] -= 1\n            if indegree[neighbor] == 0: queue.append(neighbor)\n    return completed == course_count\n\nReturn only the corrected can_finish function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"can_finish","tests":[{"args":[2,[[1,0]]],"expected":true},{"args":[2,[[1,0],[0,1]]],"expected":false},{"args":[4,[[1,0],[2,1],[3,2]]],"expected":true},{"args":[5,[[1,0],[2,0],[3,1],[1,3]]],"expected":false}]}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"hand_authored","review_status":"human_checked"},"tags":["dsa","repair","graph","topological_sort","pass_at_1"],"visibility":"held_out"}
