put_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","records","conflict_resolution","tie_breaking"]}
