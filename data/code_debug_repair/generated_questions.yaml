ndency in affected and service not in affected:\n                affected.add(service)\n                progress = True\n    remaining = set(affected)\n    result = []\n    while remaining:\n        batch = sorted(service for service in remaining if all(dependency not in remaining for owner, dependency in dependencies if owner == service))\n        if not batch:\n            return []\n        result.append(batch)\n        remaining.difference_update(batch)\n    return result"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","graph","dependency_propagation"]}
  - {"id":"code_reservation_capacity_001","subcategory":"function_implementation","difficulty":"hard","split":"dev","visibility":"public","prompt":"A maintenance ticket for a small internal Python service needs this missing helper.\n\nFunction: reservation_capacity(capacity, reservations, cancellations)\nContract: Reservations are [id,start,end,units] half-open intervals. Ignore cancelled ids. Return the earliest timestamp where active units exceed capacity, or None. Process endings before starts at equal timestamps.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"reservation_capacity","tests":[{"args":[3,[["a",1,5,2],["b",3,6,2]],[]],"expected":3,"preserve_args":[1,2]},{"args":[2,[["a",1,3,2],["b",3,5,2]],[]],"expected":null,"preserve_args":[1,2]},{"args":[1,[["a",1,4,2]],["a"]],"expected":null,"preserve_args":[1,2]},{"args":[5,[],[]],"expected":null,"preserve_args":[1,2]},{"args":[3,[["ending",1,4,3],["starting",4,7,3]],[]],"expected":null,"preserve_args":[1,2]}],"reference_solution":"def reservation_capacity(capacity, reservations, cancellations):\n    cancelled = set(cancellations)\n    events = []\n    for reservation, start, end, units in reservations:\n        if reservation not in cancelled:\n            events.append([start, units])\n            events.append([end, -units])\n    events.sort(key=lambda event: (event[0], event[1]))\n    active = 0\n    for time, change in events:\n        active += change\n        if active > capacity:\n            return time\n    return None"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","swe