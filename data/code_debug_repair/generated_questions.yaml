  - {"id":"code_invoice_totals_001","subcategory":"function_implementation","difficulty":"medium","split":"dev","visibility":"public","prompt":"A maintenance ticket for an internal records pipeline needs this missing helper.\n\nFunction: invoice_totals(lines, discounts)\nContract: Lines are [invoice_id, quantity, unit_price]. Sum each invoice, then apply its integer percentage discount once to the total using floor division. Return [invoice_id,total] rows ordered by id.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"invoice_totals","tests":[{"args":[[["b",2,50],["a",1,99],["b",1,25]],{"b":10}],"expected":[["a",99],["b",112]],"preserve_args":[0,1]},{"args":[[],{}],"expected":[],"preserve_args":[0,1]},{"args":[[["x",3,10]],{"x":100}],"expected":[["x",0]],"preserve_args":[0,1]},{"args":[[["x",1,101]],{"x":25}],"expected":[["x",75]],"preserve_args":[0,1]}],"reference_solution":"def invoice_totals(lines, discounts):\n    totals = {}\n    for invoice, quantity, price in lines:\n        totals[invoice] = totals.get(invoice, 0) + quantity * price\n    result = []\n    for invoice in sorted(totals):\n        discount = discounts.get(invoice, 0)\n        result.append([invoice, totals[invoice] * (100 - discount) // 100])\n    return result"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","aggregation","percentage","records"]}
  - {"id":"code_feature_rollout_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"held_out","prompt":"Complete a small utility used by an access and rollout policy service.\n\nFunction: feature_rollout(users, rules, overrides)\nContract: Rules are [region, minimum_score]. A user is enabled when any matching-region rule is met; an override by user id wins. Return enabled user ids sorted.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"feature_rollout","tests":[{"args":[[{"id":"b","region":"in","score":8},{"id":"a","region":"us","score":4}],[["in",7],["us",5]],{"a":true}],"expected":["a","b"],"preserve_args":[0,1,2]},{"args":[[],[],{}],"expected":[],"preserve_args":[0,1,2]},{"args":[[{"id":"x","region":"in","score":9}],[["in",5]],{"x":false}],"expected":[],"preserve_args":[0,1,2]},{"args":[[{"id":"x","region":"eu","score":1}],[],{"x":true}],"expected":["x"],"preserve_args":[0,1,2]}],"reference_solution":"def feature_rollout(users, rules, overrides):\n    enabled = []\n    for user in users:\n        value = any(user['region'] == region and user['score'] >= minimum for region, minimum in rules)\n        if user['id'] in overrides:\n            value = overrides[user['id']]\n        if value:\n            enabled.append(user['id'])\n    return sorted(enabled)"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","policy_resolution","overrides"]}
  - {"id":"code_first_capacity_breach_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"public","prompt":"A regression-safe change in an event-consumer worker requires this helper.\n\nFunction: first_capacity_breach(capacity, changes)\nContract: Changes are [time, delta]. Combine changes at the same time, process times ascending, and return the first [time,total] whose running total exceeds capacity, or None.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"first_capacity_breach","tests":[{"args":[3,[[1,2],[2,2]]],"expected":[2,4],"preserve_args":[1]},{"args":[3,[[1,4],[1,-1]]],"expected":null,"preserve_args":[1]},{"args":[0,[]],"expected":null,"preserve_args":[1]},{"args":[5,[[2,6],[1,-2]]],"expected":null,"preserve_args":[1]}],"reference_solution":"def first_capacity_breach(capacity, changes):\n    by_time = {}\n    for time, delta in changes:\n        by_time[time] = by_time.get(time, 0) + delta\n    total = 0\n    for time in sorted(by_time):\n        total += by_time[time]\n        if total > capacity:\n            return [time, total]\n    return None"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","event_processing","aggregation","boundaries"]}
  - {"id":"code_correlate_requests_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"held_out","prompt":"Implement the repository helper below for a small internal Python service.\n\nFunction: correlate_requests(requests, responses)\nContract: Requests are [id,start]; responses are [id,end,status]. Use the latest response for each id. Return [id,latency,status] for matched ids, ordered by descending latency then id.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"correlate_requests","tests":[{"args":[[["a",2],["b",5]],[["a",7,200],["b",8,500]]],"expected":[["a",5,200],["b",3,500]],"preserve_args":[0,1]},{"args":[[],[]],"expected":[],"preserve_args":[0,1]},{"args":[[["x",1]],[["x",3,202],["x",5,200]]],"expected":[["x",4,200]],"preserve_args":[0,1]},{"args":[[["x",1]],[["y",2,200]]],"expected":[],"preserve_args":[0,1]}],"reference_solution":"def correlate_requests(requests, responses):\n    starts = {request_id: start for request_id, start in requests}\n    latest = {}\n    for request_id, end, status in responses:\n        latest[request_id] = [end, status]\n    rows = [[request_id, latest[request_id][0] - start, latest[request_id][1]] for request_id, start in starts.items() if request_id in latest]\n    return sorted(rows, key=lambda row: (-row[1], row[0]))"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","join","latency","tie_breaking"]}
  - {"id":"code_partition_batches_001","subcategory":"function_implementation","difficulty":"medium","split":"dev","visibility":"public","prompt":"A maintenance ticket for a small internal Python service needs this missing helper.\n\nFunction: partition_batches(items, limit)\nContract: Items are [id,size] in processing order and each size is at most limit. Greedily fill a batch until the next item would exceed limit. Return batches of ids and preserve order.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"partition_batches","tests":[{"args":[[["a",2],["b",3],["c",2]],5],"expected":[["a","b"],["c"]],"preserve_args":[0]},{"args":[[],3],"expected":[],"preserve_args":[0]},{"args":[[["x",5]],5],"expected":[["x"]],"preserve_args":[0]},{"args":[[["a",4],["b",2]],5],"expected":[["a"],["b"]],"preserve_args":[0]}],"reference_solution":"def partition_batches(items, limit):\n    batches = []\n    current = []\n    used = 0\n    for item_id, size in items:\n        if current and used + size > limit:\n            batches.append(current)\n            current = []\n            used = 0\n        current.append(item_id)\n        used += size\n    if current:\n        batches.append(current)\n    return batches"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","greedy","batching","boundaries"]}
  - {"id":"code_inventory_events_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"held_out","prompt":"Complete a small utility used by a back-office reconciliation job.\n\nFunction: inventory_events(opening, events)\nContract: Apply [event_id,sku,delta] events once per unique event id, keeping the first occurrence. Reject an event that would make stock negative. Return [rejected_ids, sorted_stock].\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"inventory_events","tests":[{"args":[{"a":3},[["e1","a",-2],["e2","a",-2]]],"expected":[["e2"],{"a":1}],"preserve_args":[0,1]},{"args":[{},[]],"expected":[[],{}],"preserve_args":[0,1]},{"args":[{},[["e","x",2],["e","x",9]]],"expected":[[],{"x":2}],"preserve_args":[0,1]},{"args":[{"b":1,"a":0},[]],"expected":[[],{"a":0,"b":1}],"preserve_args":[0,1]}],"reference_solution":"def inventory_events(opening, events):\n    stock = dict(opening)\n    seen = set()\n    rejected = []\n    for event_id, sku, delta in events:\n        if event_id in seen:\n            continue\n        seen.add(event_id)\n        value = stock.get(sku, 0) + delta\n        if value < 0:\n            rejected.append(event_id)\n        else:\n            stock[sku] = value\n    return [rejected, {sku: stock[sku] for sku in sorted(stock)}]"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","reconciliation","deduplication","state_tracking"]}
  - {"id":"code_service_health_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"public","prompt":"A regression-safe change in a small internal Python service requires this helper.\n\nFunction: service_health(services, checks)\nContract: Checks are [service,check,passed]. A service is healthy only if it has every required check and all latest check results pass. Return [healthy_ids, unhealthy_ids], each sorted.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"service_health","tests":[{"args":[{"api":["ping","db"],"web":["ping"]},[["api","ping",true],["api","db",false],["web","ping",true]]],"expected":[["web"],["api"]],"preserve_args":[0,1]},{"args":[{},[]],"expected":[[],[]],"preserve_args":[0,1]},{"args":[{"x":[]},[]],"expected":[["x"],[]],"preserve_args":[0,1]},{"args":[{"x":["a"]},[["x","a",false],["x","a",true]]],"expected":[["x"],[]],"preserve_args":[0,1]}],"reference_solution":"def service_health(services, checks):\n    latest = {}\n    for service, check, passed in checks:\n        latest[[service, check][0] + '\\0' + check] = passed\n    healthy = []\n    unhealthy = []\n    for service, required in services.items():\n        ok = all((service + '\\0' + check) in latest and latest[service + '\\0' + check] for check in required)\n        (healthy if ok else unhealthy).append(service)\n    return [sorted(healthy), sorted(unhealthy)]"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","latest_state","completeness","classification"]}
  - {"id":"code_rank_search_results_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"held_out","prompt":"Implement the repository helper below for a small internal Python service.\n\nFunction: rank_search_results(results, blocked)\nContract: Ignore blocked ids and keep the greatest score per id, with equal scores keeping the later title. Return [id,title,score] rows ordered by score descending then id.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"rank_search_results","tests":[{"args":[[["b","B",8],["a","old",8],["a","new",8]],[]],"expected":[["a","new",8],["b","B",8]],"preserve_args":[0,1]},{"args":[[],[]],"expected":[],"preserve_args":[0,1]},{"args":[[["x","X",3]],["x"]],"expected":[],"preserve_args":[0,1]},{"args":[[["x","low",2],["x","high",5]],[]],"expected":[["x","high",5]],"preserve_args":[0,1]}],"reference_solution":"def rank_search_results(results, blocked):\n    blocked_set = set(blocked)\n    chosen = {}\n    for item_id, title, score in results:\n        if item_id not in blocked_set and (item_id not in chosen or score >= chosen[item_id][1]):\n            chosen[item_id] = [title, score]\n    rows = [[item_id] + chosen[item_id] for item_id in chosen]\n    return sorted(rows, key=lambda row: (-row[2], row[0]))"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","ranking","deduplication","tie_breaking"]}
  - {"id":"code_membership_events_001","subcategory":"function_implementation","difficulty":"medium","split":"dev","visibility":"public","prompt":"A maintenance ticket for an event-consumer worker needs this missing helper.\n\nFunction: membership_events(snapshot, events)\nContract: Apply [user,action,group] events where action is add or remove. Ignore duplicate effects. Return a user-sorted dictionary of sorted non-empty group lists.\n\nKeep the public signature unchanged and do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"membership_events","tests":[{"args":[{"u":["a"]},[["u","add","b"],["u","remove","a"]]],"expected":{"u":["b"]},"preserve_args":[0,1]},{"args":[{},[]],"expected":{},"preserve_args":[0,1]},{"args":[{},[["x","remove","a"]]],"expected":{},"preserve_args":[0,1]},{"args":[{"b":["z"],"a":["y"]},[]],"expected":{"a":["y"],"b":["z"]},"preserve_args":[0,1]}],"reference_solution":"def membership_events(snapshot, events):\n    state = {user: set(groups) for user, groups in snapshot.items()}\n    for user, action, group in events:\n        groups = state.setdefault(user, set())\n        if action == 'add':\n            groups.add(group)\n        else:\n            groups.discard(group)\n    return {user: sorted(groups) for user, groups in sorted(state.items()) if groups}"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","event_processing","sets","immutable_update"]}
