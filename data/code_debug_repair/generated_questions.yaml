  - {"id":"code_normalize_event_codes_001","subcategory":"function_implementation","difficulty":"easy","split":"dev","visibility":"public","prompt":"Implement normalize_event_codes(codes). Trim each code, uppercase it, discard blank codes, and return first occurrences in input order. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"normalize_event_codes","tests":[{"args":[[" auth ","AUTH","","pay"]],"expected":["AUTH","PAY"],"preserve_args":[0]},{"args":[[]],"expected":[],"preserve_args":[0]},{"args":[["a"," b ","A"]],"expected":["A","B"],"preserve_args":[0]},{"args":[[" x "]],"expected":["X"],"preserve_args":[0]}],"reference_solution":"def normalize_event_codes(codes):\n    result = []\n    for code in codes:\n        value = code.strip().upper()\n        if value and value not in result:\n            result.append(value)\n    return result"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","sanity","normalization"]}
  - {"id":"code_parse_feature_flags_001","subcategory":"function_implementation","difficulty":"easy","split":"test","visibility":"held_out","prompt":"Implement parse_feature_flags(lines). Ignore blank and # comment lines. Parse NAME=on/off case-insensitively, trim both sides, and let later entries win. Return a dictionary of booleans. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"parse_feature_flags","tests":[{"args":[["A=on","B=off","A=off"]],"expected":{"A":false,"B":false},"preserve_args":[0]},{"args":[[" # note"," X = ON "]],"expected":{"X":true},"preserve_args":[0]},{"args":[[]],"expected":{},"preserve_args":[0]},{"args":[["cache=off"]],"expected":{"cache":false},"preserve_args":[0]}],"reference_solution":"def parse_feature_flags(lines):\n    result = {}\n    for line in lines:\n        text = line.strip()\n        if not text or text.startswith('#'):\n            continue\n        key, value = text.split('=', 1)\n        result[key.strip()] = value.strip().lower() == 'on'\n    return result"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","sanity","parsing"]}
  - {"id":"code_apply_profile_patch_001","subcategory":"function_implementation","difficulty":"easy","split":"test","visibility":"public","prompt":"Implement apply_profile_patch(profile, patch). Return a new profile with patch values applied; a None patch value deletes that key. Preserve the original inputs. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"apply_profile_patch","tests":[{"args":[{"a":1,"b":2},{"b":3,"a":null}],"expected":{"b":3},"preserve_args":[0,1]},{"args":[{},{"x":1}],"expected":{"x":1},"preserve_args":[0,1]},{"args":[{"x":1},{}],"expected":{"x":1},"preserve_args":[0,1]},{"args":[{"x":1},{"missing":null}],"expected":{"x":1},"preserve_args":[0,1]}],"reference_solution":"def apply_profile_patch(profile, patch):\n    result = dict(profile)\n    for key, value in patch.items():\n        if value is None:\n            result.pop(key, None)\n        else:\n            result[key] = value\n    return result"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","sanity","immutable_update"]}
  - {"id":"code_select_latest_records_001","subcategory":"function_implementation","difficulty":"easy","split":"test","visibility":"held_out","prompt":"Implement select_latest_records(records). For each id retain the record with the greatest integer version; equal versions keep the later input record. Return retained records ordered by id. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"select_latest_records","tests":[{"args":[[{"id":"b","version":1},{"id":"a","version":2},{"id":"b","version":3}]],"expected":[{"id":"a","version":2},{"id":"b","version":3}],"preserve_args":[0]},{"args":[[{"id":"a","version":1,"v":"x"},{"id":"a","version":1,"v":"y"}]],"expected":[{"id":"a","version":1,"v":"y"}],"preserve_args":[0]},{"args":[[]],"expected":[],"preserve_args":[0]},{"args":[[{"id":"x","version":0}]],"expected":[{"id":"x","version":0}],"preserve_args":[0]}],"reference_solution":"def select_latest_records(records):\n    latest = {}\n    for record in records:\n        key = record['id']\n        if key not in latest or record['version'] >= latest[key]['version']:\n            latest[key] = dict(record)\n    return [latest[key] for key in sorted(latest)]"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","sanity","records"]}
  - {"id":"code_bucket_response_times_001","subcategory":"function_implementation","difficulty":"easy","split":"dev","visibility":"public","prompt":"Implement bucket_response_times(values, limits). Return counts for len(limits)+1 buckets. Bucket i contains values greater than the previous limit and less than or equal to limits[i]; the final bucket is above the last limit. Limits are sorted. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"bucket_response_times","tests":[{"args":[[1,5,6,10,11],[5,10]],"expected":[2,2,1],"preserve_args":[0,1]},{"args":[[],[2]],"expected":[0,0],"preserve_args":[0,1]},{"args":[[3,3],[3]],"expected":[2,0],"preserve_args":[0,1]},{"args":[[1,9],[]],"expected":[2],"preserve_args":[0,1]}],"reference_solution":"def bucket_response_times(values, limits):\n    counts = [0] * (len(limits) + 1)\n    for value in values:\n        index = 0\n        while index < len(limits) and value > limits[index]:\n            index += 1\n        counts[index] += 1\n    return counts"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","sanity","boundaries"]}
  - {"id":"code_group_status_runs_001","subcategory":"function_implementation","difficulty":"easy","split":"test","visibility":"held_out","prompt":"Implement group_status_runs(statuses). Run-length encode consecutive equal statuses as [status, count] pairs. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"group_status_runs","tests":[{"args":[["ok","ok","fail","ok"]],"expected":[["ok",2],["fail",1],["ok",1]],"preserve_args":[0]},{"args":[[]],"expected":[],"preserve_args":[0]},{"args":[["x"]],"expected":[["x",1]],"preserve_args":[0]},{"args":[["a","a","a"]],"expected":[["a",3]],"preserve_args":[0]}],"reference_solution":"def group_status_runs(statuses):\n    result = []\n    for status in statuses:\n        if result and result[-1][0] == status:\n            result[-1][1] += 1\n        else:\n            result.append([status, 1])\n    return result"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","sanity","state_tracking"]}
  - {"id":"code_inventory_totals_001","subcategory":"function_implementation","difficulty":"easy","split":"test","visibility":"public","prompt":"Implement inventory_totals(records). Ignore inactive records, sum integer quantity by sku, and return [[sku,total], ...] ordered by sku. Include zero and negative adjustments. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"inventory_totals","tests":[{"args":[[{"sku":"b","quantity":2,"active":true},{"sku":"a","quantity":3,"active":true},{"sku":"b","quantity":-1,"active":true}]],"expected":[["a",3],["b",1]],"preserve_args":[0]},{"args":[[{"sku":"x","quantity":9,"active":false}]],"expected":[],"preserve_args":[0]},{"args":[[]],"expected":[],"preserve_args":[0]},{"args":[[{"sku":"x","quantity":0,"active":true}]],"expected":[["x",0]],"preserve_args":[0]}],"reference_solution":"def inventory_totals(records):\n    totals = {}\n    for record in records:\n        if record['active']:\n            sku = record['sku']\n            totals[sku] = totals.get(sku, 0) + record['quantity']\n    return [[sku, totals[sku]] for sku in sorted(totals)]"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","sanity","aggregation"]}
  - {"id":"code_mask_record_fields_001","subcategory":"function_implementation","difficulty":"easy","split":"test","visibility":"held_out","prompt":"Implement mask_record_fields(records, fields). Return new records, replacing each present named field with '***'. Preserve record order and both inputs. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"mask_record_fields","tests":[{"args":[[{"name":"Ada","email":"a@x"}],["email"]],"expected":[{"name":"Ada","email":"***"}],"preserve_args":[0,1]},{"args":[[{"a":1},{"b":2}],["x"]],"expected":[{"a":1},{"b":2}],"preserve_args":[0,1]},{"args":[[],["x"]],"expected":[],"preserve_args":[0,1]},{"args":[[{"token":"z"}],[]],"expected":[{"token":"z"}],"preserve_args":[0,1]}],"reference_solution":"def mask_record_fields(records, fields):\n    hidden = set(fields)\n    return [{key: ('***' if key in hidden else value) for key, value in record.items()} for record in records]"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","sanity","immutable_update"]}
  - {"id":"code_active_usernames_001","subcategory":"function_implementation","difficulty":"easy","split":"dev","visibility":"public","prompt":"Implement active_usernames(records). Return lowercase trimmed usernames for active records, removing duplicates after normalization and sorting the result. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"active_usernames","tests":[{"args":[[{"username":" Ada ","active":true},{"username":"ada","active":true},{"username":"Lin","active":false}]],"expected":["ada"],"preserve_args":[0]},{"args":[[]],"expected":[],"preserve_args":[0]},{"args":[[{"username":" ","active":true}]],"expected":[],"preserve_args":[0]},{"args":[[{"username":"B","active":true},{"username":"a","active":true}]],"expected":["a","b"],"preserve_args":[0]}],"reference_solution":"def active_usernames(records):\n    names = set()\n    for record in records:\n        if record['active']:\n            value = record['username'].strip().lower()\n            if value:\n                names.add(value)\n    return sorted(names)"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","sanity","filtering"]}
  - {"id":"code_parse_measurements_001","subcategory":"function_implementation","difficulty":"easy","split":"test","visibility":"held_out","prompt":"Implement parse_measurements(lines). Parse name:value lines, ignore malformed lines, trim names, convert values to integers, and let later valid entries win. Return keys sorted in a dictionary. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"parse_measurements","tests":[{"args":[["b:2","bad","a: 1","b:3"]],"expected":{"a":1,"b":3},"preserve_args":[0]},{"args":[[]],"expected":{},"preserve_args":[0]},{"args":[["x:no","x:-4"]],"expected":{"x":-4},"preserve_args":[0]},{"args":[[":3","z:0"]],"expected":{"z":0},"preserve_args":[0]}],"reference_solution":"def parse_measurements(lines):\n    values = {}\n    for line in lines:\n        if ':' not in line:\n            continue\n        name, raw = line.split(':', 1)\n        name = name.strip()\n        raw = raw.strip()\n        if name and raw.lstrip('-').isdigit():\n            values[name] = int(raw)\n    return {key: values[key] for key in sorted(values)}"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","sanity","parsing"]}
  - {"id":"code_reconcile_windows_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"public","prompt":"Implement reconcile_windows(windows, blocked, minimum). Merge overlapping or touching half-open windows, subtract every blocked half-open interval, discard pieces shorter than minimum, and return pieces ordered by start. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"reconcile_windows","tests":[{"args":[[[1,5],[4,9]],[[3,4],[7,8]],2],"expected":[[1,3],[4,7]],"preserve_args":[0,1]},{"args":[[[5,8],[1,3],[3,5]],[],3],"expected":[[1,8]],"preserve_args":[0,1]},{"args":[[],[[1,2]],1],"expected":[],"preserve_args":[0,1]},{"args":[[[0,10]],[[-1,20]],1],"expected":[],"preserve_args":[0,1]}],"reference_solution":"def reconcile_windows(windows, blocked, minimum):\n    merged = []\n    for start, end in sorted(windows):\n        if merged and start <= merged[-1][1]:\n            merged[-1][1] = max(merged[-1][1], end)\n        else:\n            merged.append([start, end])\n    pieces = merged\n    for cut_start, cut_end in blocked:\n        updated = []\n        for start, end in pieces:\n            if cut_end <= start or cut_start >= end:\n                updated.append([start, end])\n            else:\n                if start < cut_start:\n                    updated.append([start, cut_start])\n                if cut_end < end:\n                    updated.append([cut_end, end])\n        pieces = updated\n    return [piece for piece in pieces if piece[1] - piece[0] >= minimum]"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","intervals","composed_operations"]}
  - {"id":"code_session_summaries_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"held_out","prompt":"Implement session_summaries(events, gap). Events are [user,time] pairs sorted by time. A new session starts when the gap from that user's previous event is greater than gap. Return [user,start,end,count] sessions ordered by start then user. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"session_summaries","tests":[{"args":[[["a",1],["b",2],["a",4],["a",10]],3],"expected":[["a",1,4,2],["b",2,2,1],["a",10,10,1]],"preserve_args":[0]},{"args":[[],2],"expected":[],"preserve_args":[0]},{"args":[[["x",1],["x",3]],2],"expected":[["x",1,3,2]],"preserve_args":[0]},{"args":[[["b",1],["a",1]],0],"expected":[["a",1,1,1],["b",1,1,1]],"preserve_args":[0]}],"reference_solution":"def session_summaries(events, gap):\n    active = {}\n    result = []\n    for user, time in events:\n        if user not in active or time - active[user][1] > gap:\n            if user in active:\n                result.append([user] + active[user])\n            active[user] = [time, time, 1]\n        else:\n            active[user][1] = time\n            active[user][2] += 1\n    for user, data in active.items():\n        result.append([user] + data)\n    return sorted(result, key=lambda row: (row[1], row[0]))"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","event_processing","state_tracking"]}
  - {"id":"code_dependency_batches_001","subcategory":"function_implementation","difficulty":"medium","split":"dev","visibility":"public","prompt":"Implement dependency_batches(jobs, dependencies). Return deterministic execution batches for jobs. Each [job, prerequisite] edge requires the prerequisite first; each batch contains all currently available jobs sorted. Return [] if a cycle exists. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"dependency_batches","tests":[{"args":[["build","test","ship"],[["test","build"],["ship","test"]]],"expected":[["build"],["test"],["ship"]],"preserve_args":[0,1]},{"args":[["a","b","c"],[["c","a"]]],"expected":[["a","b"],["c"]],"preserve_args":[0,1]},{"args":[["a","b"],[["a","b"],["b","a"]]],"expected":[],"preserve_args":[0,1]},{"args":[[],[]],"expected":[],"preserve_args":[0,1]}],"reference_solution":"def dependency_batches(jobs, dependencies):\n    remaining = {job: set() for job in jobs}\n    for job, prerequisite in dependencies:\n        remaining[job].add(prerequisite)\n    result = []\n    completed = set()\n    while len(completed) < len(jobs):\n        batch = sorted(job for job in jobs if job not in completed and remaining[job] <= completed)\n        if not batch:\n            return []\n        result.append(batch)\n        completed.update(batch)\n    return result"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","graph","deterministic_order"]}
  - {"id":"code_ledger_balances_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"held_out","prompt":"Implement ledger_balances(opening, entries, voided). Starting from opening balances, apply non-voided [entry_id,account,amount] entries in order. Return [[account,balance], ...] for every resulting nonzero account, ordered by account. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"ledger_balances","tests":[{"args":[{"a":10},[["e1","a",-3],["e2","b",4]],["e2"]],"expected":[["a",7]],"preserve_args":[0,1,2]},{"args":[{},[],[]],"expected":[],"preserve_args":[0,1,2]},{"args":[{"x":1},[["e","x",-1]],[]],"expected":[],"preserve_args":[0,1,2]},{"args":[{},[["e","b",2],["f","a",3]],[]],"expected":[["a",3],["b",2]],"preserve_args":[0,1,2]}],"reference_solution":"def ledger_balances(opening, entries, voided):\n    balances = dict(opening)\n    voided_ids = set(voided)\n    for entry_id, account, amount in entries:\n        if entry_id not in voided_ids:\n            balances[account] = balances.get(account, 0) + amount\n    return [[account, balances[account]] for account in sorted(balances) if balances[account] != 0]"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","records","reconciliation"]}
  - {"id":"code_effective_permissions_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"public","prompt":"Implement effective_permissions(roles, grants, denies). roles maps each user to role names. grants maps roles to permissions. Return each user's sorted granted permissions after removing that user's denied permissions. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"effective_permissions","tests":[{"args":[{"u":["reader","writer"]},{"reader":["read"],"writer":["read","write"]},{"u":["write"]}],"expected":{"u":["read"]},"preserve_args":[0,1,2]},{"args":[{},{},{}],"expected":{},"preserve_args":[0,1,2]},{"args":[{"b":["x"],"a":[]},{"x":["p"]},{}],"expected":{"a":[],"b":["p"]},"preserve_args":[0,1,2]},{"args":[{"u":["missing"]},{},{"u":["p"]}],"expected":{"u":[]},"preserve_args":[0,1,2]}],"reference_solution":"def effective_permissions(roles, grants, denies):\n    result = {}\n    for user, user_roles in roles.items():\n        allowed = set()\n        for role in user_roles:\n            allowed.update(grants.get(role, []))\n        allowed.difference_update(denies.get(user, []))\n        result[user] = sorted(allowed)\n    return {user: result[user] for user in sorted(result)}"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","sets","policy_resolution"]}
  - {"id":"code_rooms_required_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"held_out","prompt":"Implement rooms_required(meetings). Meetings are half-open [start,end] intervals. Return the minimum rooms required; a room is reusable when one meeting ends exactly as another starts. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"rooms_required","tests":[{"args":[[[0,10],[5,7],[10,12]]],"expected":2,"preserve_args":[0]},{"args":[[]],"expected":0,"preserve_args":[0]},{"args":[[[1,2]]],"expected":1,"preserve_args":[0]},{"args":[[[1,4],[2,5],[3,6]]],"expected":3,"preserve_args":[0]}],"reference_solution":"def rooms_required(meetings):\n    events = []\n    for start, end in meetings:\n        events.append([start, 1])\n        events.append([end, -1])\n    events.sort(key=lambda event: (event[0], event[1]))\n    active = 0\n    best = 0\n    for _, change in events:\n        active += change\n        best = max(best, active)\n    return best"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","scheduling","sweep_line"]}
  - {"id":"code_alert_streaks_001","subcategory":"function_implementation","difficulty":"medium","split":"dev","visibility":"public","prompt":"Implement alert_streaks(readings, threshold, minimum). Return inclusive index ranges of maximal consecutive readings at least threshold whose length is at least minimum. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"alert_streaks","tests":[{"args":[[1,5,6,2,7,8,9],5,2],"expected":[[1,2],[4,6]],"preserve_args":[0]},{"args":[[],1,1],"expected":[],"preserve_args":[0]},{"args":[[3,3],3,2],"expected":[[0,1]],"preserve_args":[0]},{"args":[[5,1,5],5,2],"expected":[],"preserve_args":[0]}],"reference_solution":"def alert_streaks(readings, threshold, minimum):\n    result = []\n    start = None\n    for index in range(len(readings) + 1):\n        qualifies = index < len(readings) and readings[index] >= threshold\n        if qualifies and start is None:\n            start = index\n        if not qualifies and start is not None:\n            if index - start >= minimum:\n                result.append([start, index - 1])\n            start = None\n    return result"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","sequence_processing","boundaries"]}
  - {"id":"code_has_config_cycle_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"held_out","prompt":"Implement has_config_cycle(links). links maps a configuration name to its parent name or None. Return whether any chain enters a cycle, including a self-cycle. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"has_config_cycle","tests":[{"args":[{"a":"b","b":"a"}],"expected":true,"preserve_args":[0]},{"args":[{"a":"b","b":null}],"expected":false,"preserve_args":[0]},{"args":[{}],"expected":false,"preserve_args":[0]},{"args":[{"x":"x"}],"expected":true,"preserve_args":[0]}],"reference_solution":"def has_config_cycle(links):\n    done = set()\n    for start in links:\n        seen = set()\n        node = start\n        while node is not None and node in links and node not in done:\n            if node in seen:\n                return True\n            seen.add(node)\n            node = links[node]\n        done.update(seen)\n    return False"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","graph","cycle_detection"]}
  - {"id":"code_filter_compatible_versions_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"public","prompt":"Implement filter_compatible_versions(versions, minimum, excluded). Versions are [major,minor,patch]. Return sorted distinct versions at least minimum with no component pattern present in excluded. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"filter_compatible_versions","tests":[{"args":[[[1,2,0],[1,1,9],[1,2,0],[2,0,0]],[1,2,0],[[2,0,0]]],"expected":[[1,2,0]],"preserve_args":[0,1,2]},{"args":[[],[0,0,0],[]],"expected":[],"preserve_args":[0,1,2]},{"args":[[[1,0,0]],[2,0,0],[]],"expected":[],"preserve_args":[0,1,2]},{"args":[[[1,0,1]],[1,0,0],[]],"expected":[[1,0,1]],"preserve_args":[0,1,2]}],"reference_solution":"def filter_compatible_versions(versions, minimum, excluded):\n    blocked = {tuple(value) for value in excluded}\n    values = {tuple(value) for value in versions if tuple(value) >= tuple(minimum) and tuple(value) not in blocked}\n    return [list(value) for value in sorted(values)]"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","versioning","filtering"]}
  - {"id":"code_fulfill_orders_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"held_out","prompt":"Implement fulfill_orders(stock, orders). Process [order_id,sku,quantity] in order. Fulfill an order only when enough stock remains. Return [fulfilled_ids, remaining_stock] with stock keys sorted. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"fulfill_orders","tests":[{"args":[{"a":5},[["o1","a",3],["o2","a",3]]],"expected":[["o1"],{"a":2}],"preserve_args":[0,1]},{"args":[{},[["o","x",1]]],"expected":[[],{}],"preserve_args":[0,1]},{"args":[{"b":1,"a":2},[]],"expected":[[],{"a":2,"b":1}],"preserve_args":[0,1]},{"args":[{"a":2},[["o","a",2]]],"expected":[["o"],{"a":0}],"preserve_args":[0,1]}],"reference_solution":"def fulfill_orders(stock, orders):\n    remaining = dict(stock)\n    fulfilled = []\n    for order_id, sku, quantity in orders:\n        if remaining.get(sku, 0) >= quantity:\n            remaining[sku] -= quantity\n            fulfilled.append(order_id)\n    return [fulfilled, {sku: remaining[sku] for sku in sorted(remaining)}]"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","state_tracking","allocation"]}
  - {"id":"code_snapshot_changes_001","subcategory":"function_implementation","difficulty":"medium","split":"dev","visibility":"public","prompt":"Implement snapshot_changes(before, after). Return [added, removed, changed] key lists, each sorted. A changed key exists in both dictionaries with unequal values. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"snapshot_changes","tests":[{"args":[{"a":1,"b":2},{"b":3,"c":4}],"expected":[["c"],["a"],["b"]],"preserve_args":[0,1]},{"args":[{},{}],"expected":[[],[],[]],"preserve_args":[0,1]},{"args":[{"x":1},{"x":1}],"expected":[[],[],[]],"preserve_args":[0,1]},{"args":[{},{"z":0}],"expected":[["z"],[],[]],"preserve_args":[0,1]}],"reference_solution":"def snapshot_changes(before, after):\n    before_keys = set(before)\n    after_keys = set(after)\n    added = sorted(after_keys - before_keys)\n    removed = sorted(before_keys - after_keys)\n    changed = sorted(key for key in before_keys & after_keys if before[key] != after[key])\n    return [added, removed, changed]"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","records","set_operations"]}
  - {"id":"code_tiered_charge_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"held_out","prompt":"Implement tiered_charge(usage, tiers). tiers contains [inclusive_limit, unit_price] rows with increasing limits; the final limit is None. Charge successive usage units by tier and return the integer total. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"tiered_charge","tests":[{"args":[15,[[10,2],[20,3],[null,5]]],"expected":35,"preserve_args":[1]},{"args":[0,[[null,2]]],"expected":0,"preserve_args":[1]},{"args":[10,[[10,2],[null,4]]],"expected":20,"preserve_args":[1]},{"args":[25,[[10,1],[20,2],[null,3]]],"expected":45,"preserve_args":[1]}],"reference_solution":"def tiered_charge(usage, tiers):\n    remaining = usage\n    previous = 0\n    total = 0\n    for limit, price in tiers:\n        amount = remaining if limit is None else min(remaining, limit - previous)\n        total += amount * price\n        remaining -= amount\n        if remaining == 0:\n            break\n        previous = limit\n    return total"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","arithmetic","piecewise_rules"]}
  - {"id":"code_compress_log_bursts_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"public","prompt":"Implement compress_log_bursts(events, gap). Events are sorted [timestamp,message]. Merge consecutive equal messages when their timestamp gap is at most gap. Return [start,end,message,count] rows. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"compress_log_bursts","tests":[{"args":[[[1,"x"],[3,"x"],[4,"y"],[10,"y"]],2],"expected":[[1,3,"x",2],[4,4,"y",1],[10,10,"y",1]],"preserve_args":[0]},{"args":[[],1],"expected":[],"preserve_args":[0]},{"args":[[[1,"x"]],0],"expected":[[1,1,"x",1]],"preserve_args":[0]},{"args":[[[1,"x"],[2,"y"],[3,"x"]],5],"expected":[[1,1,"x",1],[2,2,"y",1],[3,3,"x",1]],"preserve_args":[0]}],"reference_solution":"def compress_log_bursts(events, gap):\n    result = []\n    for timestamp, message in events:\n        if result and result[-1][2] == message and timestamp - result[-1][1] <= gap:\n            result[-1][1] = timestamp\n            result[-1][3] += 1\n        else:\n            result.append([timestamp, timestamp, message, 1])\n    return result"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","event_processing","state_tracking"]}
  - {"id":"code_retry_times_001","subcategory":"function_implementation","difficulty":"medium","split":"test","visibility":"held_out","prompt":"Implement retry_times(start, delays, maintenance). Apply cumulative delays to start. Exclude retry times inside any half-open maintenance interval and return the remaining times. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"retry_times","tests":[{"args":[0,[1,2,4],[[2,4]]],"expected":[1,7],"preserve_args":[1,2]},{"args":[5,[],[]],"expected":[],"preserve_args":[1,2]},{"args":[0,[2],[[2,3]]],"expected":[],"preserve_args":[1,2]},{"args":[10,[1,1],[]],"expected":[11,12],"preserve_args":[1,2]}],"reference_solution":"def retry_times(start, delays, maintenance):\n    result = []\n    time = start\n    for delay in delays:\n        time += delay\n        blocked = any(left <= time < right for left, right in maintenance)\n        if not blocked:\n            result.append(time)\n    return result"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","scheduling","cumulative_state"]}
  - {"id":"code_join_customer_orders_001","subcategory":"function_implementation","difficulty":"medium","split":"dev","visibility":"public","prompt":"Implement join_customer_orders(customers, orders). customers maps ids to names. Sum positive order amounts for known customers and return [customer_id,name,total] rows ordered by descending total then id. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"join_customer_orders","tests":[{"args":[{"a":"Ada","b":"Bob"},[["a",3],["b",5],["a",4]]],"expected":[["a","Ada",7],["b","Bob",5]],"preserve_args":[0,1]},{"args":[{},[["x",2]]],"expected":[],"preserve_args":[0,1]},{"args":[{"a":"A"},[["a",-1]]],"expected":[],"preserve_args":[0,1]},{"args":[{"b":"B","a":"A"},[["b",2],["a",2]]],"expected":[["a","A",2],["b","B",2]],"preserve_args":[0,1]}],"reference_solution":"def join_customer_orders(customers, orders):\n    totals = {}\n    for customer, amount in orders:\n        if customer in customers and amount > 0:\n            totals[customer] = totals.get(customer, 0) + amount\n    rows = [[customer, customers[customer], totals[customer]] for customer in totals]\n    return sorted(rows, key=lambda row: (-row[2], row[0]))"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","records","join_aggregate"]}
  - {"id":"code_eligible_shortest_route_001","subcategory":"function_implementation","difficulty":"hard","split":"test","visibility":"held_out","prompt":"Implement eligible_shortest_route(nodes, edges, start, end, disabled). For an undirected graph, return the lexicographically smallest node sequence among shortest start-to-end routes that avoid disabled nodes. Return [] if unavailable. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"eligible_shortest_route","tests":[{"args":[["a","b","c","d"],[["a","b"],["b","d"],["a","c"],["c","d"]],"a","d",[]],"expected":["a","b","d"],"preserve_args":[0,1,4]},{"args":[["a","b"],[["a","b"]],"a","b",["b"]],"expected":[],"preserve_args":[0,1,4]},{"args":[["a"],[],"a","a",[]],"expected":["a"],"preserve_args":[0,1,4]},{"args":[["a","b","c"],[["a","b"]],"a","c",[]],"expected":[],"preserve_args":[0,1,4]}],"reference_solution":"def eligible_shortest_route(nodes, edges, start, end, disabled):\n    disabled_set = set(disabled)\n    if start in disabled_set or end in disabled_set:\n        return []\n    graph = {node: [] for node in nodes}\n    for left, right in edges:\n        graph[left].append(right)\n        graph[right].append(left)\n    paths = [[start]]\n    seen_depth = {start: 0}\n    while paths:\n        path = paths.pop(0)\n        node = path[-1]\n        if node == end:\n            return path\n        depth = len(path)\n        for neighbor in sorted(graph[node]):\n            if neighbor not in disabled_set and seen_depth.get(neighbor, depth) >= depth:\n                seen_depth[neighbor] = depth\n                paths.append(path + [neighbor])\n    return []"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","graph","tie_breaking","composed_operations"]}
  - {"id":"code_deployment_impact_001","subcategory":"function_implementation","difficulty":"hard","split":"test","visibility":"public","prompt":"Implement deployment_impact(services, dependencies, changed, protected). dependencies are [service,dependency]. Return affected services reachable from changed dependencies, excluding protected services and anything depending on an excluded service, ordered in deterministic dependency batches. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"deployment_impact","tests":[{"args":[["db","api","web"],[["api","db"],["web","api"]],["db"],[]],"expected":[["db"],["api"],["web"]],"preserve_args":[0,1,2,3]},{"args":[["a","b"],[["b","a"]],["a"],["b"]],"expected":[["a"]],"preserve_args":[0,1,2,3]},{"args":[["a"],[],[],[]],"expected":[],"preserve_args":[0,1,2,3]},{"args":[["a","b","c"],[["c","a"],["b","a"]],["a"],[]],"expected":[["a"],["b","c"]],"preserve_args":[0,1,2,3]}],"reference_solution":"def deployment_impact(services, dependencies, changed, protected):\n    blocked = set(protected)\n    affected = set(changed) - blocked\n    progress = True\n    while progress:\n        progress = False\n        for service, dependency in dependencies:\n            if service not in blocked and dependency in affected and service not in affected:\n                affected.add(service)\n                progress = True\n    remaining = set(affected)\n    result = []\n    while remaining:\n        batch = sorted(service for service in remaining if all(dependency not in remaining for owner, dependency in dependencies if owner == service))\n        if not batch:\n            return []\n        result.append(batch)\n        remaining.difference_update(batch)\n    return result"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","graph","dependency_propagation"]}
  - {"id":"code_reservation_capacity_001","subcategory":"function_implementation","difficulty":"hard","split":"test","visibility":"held_out","prompt":"Implement reservation_capacity(capacity, reservations, cancellations). Reservations are [id,start,end,units] half-open intervals. Ignore cancelled ids. Return the earliest timestamp where active units exceed capacity, or None. Process endings before starts at equal timestamps. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"reservation_capacity","tests":[{"args":[3,[["a",1,5,2],["b",3,6,2]],[]],"expected":3,"preserve_args":[1,2]},{"args":[2,[["a",1,3,2],["b",3,5,2]],[]],"expected":null,"preserve_args":[1,2]},{"args":[1,[["a",1,4,2]],["a"]],"expected":null,"preserve_args":[1,2]},{"args":[5,[],[]],"expected":null,"preserve_args":[1,2]}],"reference_solution":"def reservation_capacity(capacity, reservations, cancellations):\n    cancelled = set(cancellations)\n    events = []\n    for reservation, start, end, units in reservations:\n        if reservation not in cancelled:\n            events.append([start, units])\n            events.append([end, -units])\n    events.sort(key=lambda event: (event[0], event[1]))\n    active = 0\n    for time, change in events:\n        active += change\n        if active > capacity:\n            return time\n    return None"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","sweep_line","event_ordering"]}
  - {"id":"code_workflow_duration_001","subcategory":"function_implementation","difficulty":"hard","split":"dev","visibility":"public","prompt":"Implement workflow_duration(steps, durations, dependencies). Return the minimum total completion time with unlimited parallelism. Each [step,prerequisite] dependency must finish first. Return -1 for a cycle. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"workflow_duration","tests":[{"args":[["a","b","c"],{"a":2,"b":3,"c":4},[["c","a"],["c","b"]]],"expected":7,"preserve_args":[0,1,2]},{"args":[["a","b"],{"a":1,"b":1},[["a","b"],["b","a"]]],"expected":-1,"preserve_args":[0,1,2]},{"args":[[],{},[]],"expected":0,"preserve_args":[0,1,2]},{"args":[["a","b"],{"a":2,"b":3},[]],"expected":3,"preserve_args":[0,1,2]}],"reference_solution":"def workflow_duration(steps, durations, dependencies):\n    remaining = set(steps)\n    finish = {}\n    while remaining:\n        ready = sorted(step for step in remaining if all(prerequisite in finish for owner, prerequisite in dependencies if owner == step))\n        if not ready:\n            return -1\n        for step in ready:\n            start = max([finish[prerequisite] for owner, prerequisite in dependencies if owner == step] or [0])\n            finish[step] = start + durations[step]\n            remaining.remove(step)\n    return max(finish.values()) if finish else 0"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","dag","critical_path"]}
  - {"id":"code_reconcile_event_streams_001","subcategory":"function_implementation","difficulty":"hard","split":"test","visibility":"held_out","prompt":"Implement reconcile_event_streams(primary, replica). Events are [id,sequence,payload]. For each id choose the greatest sequence across both streams; equal sequences prefer primary. Return [id,sequence,payload,source] rows ordered by sequence then id. Do not mutate inputs. Return only the function definition and use no imports.","response_contract":{"type":"code","format":"python_function"},"expected":{"value":{"entry_point":"reconcile_event_streams","tests":[{"args":[[["a",2,"p"],["b",1,"x"]],[["a",2,"r"],["c",3,"z"]]],"expected":[["b",1,"x","primary"],["a",2,"p","primary"],["c",3,"z","replica"]],"preserve_args":[0,1]},{"args":[[],[]],"expected":[],"preserve_args":[0,1]},{"args":[[["a",1,"p"]],[["a",2,"r"]]],"expected":[["a",2,"r","replica"]],"preserve_args":[0,1]},{"args":[[["b",1,"x"],["a",1,"p"]],[]],"expected":[["a",1,"p","primary"],["b",1,"x","primary"]],"preserve_args":[0,1]}],"reference_solution":"def reconcile_event_streams(primary, replica):\n    chosen = {}\n    for source, events in [['replica', replica], ['primary', primary]]:\n        for event_id, sequence, payload in events:\n            if event_id not in chosen or sequence > chosen[event_id][0] or (sequence == chosen[event_id][0] and source == 'primary'):\n                chosen[event_id] = [sequence, payload, source]\n    rows = [[event_id] + chosen[event_id] for event_id in chosen]\n    return sorted(rows, key=lambda row: (row[1], row[0]))"}},"scoring":{"method":"executable_python","parameters":{"timeout_seconds":1.0,"memory_limit_mb":128,"max_output_characters":10000}},"provenance":{"kind":"synthetic","review_status":"human_checked","generator":"generate_coding_benchmark.py","seed":20260629},"tags":["practical_python","fresh_composed","pass_at_1","records","conflict_resolution","tie_breaking"]}
