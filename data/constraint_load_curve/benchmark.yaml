id: constraint_load_curve
title: Following Multiple Rules
description: Ten task carriers measured across one to four cumulative rule levels.
suite: C
status: complete
task_types:
  - prose explanation
  - extraction and filtering
  - list generation
  - JSON transformation
  - CSV transformation
  - constrained rewriting
  - classification and prioritisation
  - professional email
  - YAML configuration
  - ordering and tie-breaking
