- id: summary_outage_001
  subcategory: uncertain_incident
  difficulty: hard
  split: test
  prompt: 'Write an executive incident brief in no more than 75 words. Preserve the timeline, business
    impact, uncertainty, and remaining action. Do not state a cause as confirmed.


    Source: Between 18:06 and 18:43 UTC, customers in Europe intermittently failed to upload files larger
    than 20 MB. Smaller uploads and customers in other regions were unaffected. Logs show 6,240 failed
    attempts from 1,870 accounts; retries succeeded for about 61% of affected attempts. No files were
    corrupted, and stored files remained available. Engineers disabled a new traffic-routing rule at 18:31,
    after which failures declined and stopped by 18:43. The rule is a possible contributor, but two failures
    also appeared in logs from before its 17:50 deployment. A network provider reported brief packet loss
    in Frankfurt but has not confirmed timing. Support received 94 contacts. Engineering will compare
    packet traces and run a controlled replay before deciding whether to re-enable the rule.'
  response_contract:
    type: text
    format: plain_text
  expected:
    value: 'From 18:06–18:43 UTC, large-file uploads intermittently failed for European customers: 6,240
      attempts across 1,870 accounts, with 61% succeeding on retry. Smaller uploads, other regions, and
      stored files were unaffected; no corruption occurred. Failures stopped after a routing rule was
      disabled, but earlier failures and possible Frankfurt packet loss leave the cause unconfirmed. Engineering
      will analyse traces and replay traffic before re-enabling it.'
  scoring:
    method: llm_judge
    parameters:
      rubric: grounded_summary_v1
      pass_threshold: 0.7
      minimum_faithfulness: 3
      max_words: 75
  provenance:
