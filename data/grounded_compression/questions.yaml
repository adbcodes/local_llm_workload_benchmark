      request fee-waived cancellation only for IR-482809. Payments were 18:42 and 18:49; the first confirmation
      arrived 18:51. CASE-19308 was filed with three redacted screenshots; nothing was cancelled. Support
      estimates 48 hours. Open: check the refund cutoff and call if delay risks it. Case auto-filled obsolete
      phone ending 1180; current number ends 7741, already noted in the description.'
