- id: summary_chat_handoff_004
  subcategory: chat_history_handoff
  difficulty: hard
  split: test
  prompt: 'Write a case handoff for another assistant in no more than 165 words. Preserve chronology,
    amounts, written evidence, superseded disputes, current decisions, and unresolved risks.


    Source: User: I have a messy freelance payment dispute and need the next steps without making it worse.
    Client says my final invoice is outside scope, but they already use the work.


    Assistant: I can organise the record, not provide legal advice. Please give the contract terms, invoice
    amount, work delivered, approvals, and what the client specifically disputes.


    User: Contract was INR 2,40,000 for a dashboard redesign: 40% advance, 30% after prototype approval,
    30% on final handoff. They paid first two instalments. Final invoice is INR 72,000, number NR-026.
    Due 30 June.


    Assistant: So INR 1,68,000 has been paid and INR 72,000 is invoiced. What evidence shows prototype
    approval and final handoff, and was extra work requested?


    User: Prototype approved by email 8 May. Final Figma and assets sent 12 June. Product lead replied
    “looks good, we’ll ship this.” It went live 18 June. Then finance said the mobile empty states were
    extra and asked for a revised invoice excluding them.


    Assistant: The live deployment and written response support delivery, but we should not interpret
    them as a legal conclusion. Were mobile empty states in the signed scope or added later?


    User: Scope says “responsive dashboard screens for desktop and mobile, including loading, error and
    empty states.” There were 14 screens in appendix A. I delivered 14. Later they asked for two tablet
    variants in Slack. I did those too and never charged extra.


    Assistant: That wording appears relevant: mobile empty states are expressly listed, while the tablet
    variants were later additions not billed. Preserve the signed appendix, the 8 May approval, 12 June
    delivery, and 18 June live evidence.


    User: Finance email on 2 July says they will pay INR 48,000 as “undisputed portion” if I issue a credit
    note for INR 24,000. They want the credit note by tomorrow. I haven''t replied.


    Assistant: Do not issue a credit note just to acknowledge receipt unless you intend to reduce the
    invoice. A neutral response can ask them to identify the contractual basis for INR 24,000 and state
    that NR-026 remains unchanged while you review.


    User: Product lead called me and said finance is doing this to every contractor because budgets froze.
    That''s verbal, no recording. He asked me not to quote him.


    Assistant: Treat that as an unverified private claim, not evidence to include in a demand. Record
    it privately as context and do not attribute it without permission.


    User: I also found that the purchase order says INR 2,16,000, not 2,40,000. They created it after
    signing and I did not notice. Payments so far match 40% and 30% of 2,40,000, though: 96,000 and 72,000.


    Assistant: That discrepancy is important. The signed contract total and payment pattern support INR
    2,40,000, but the lower PO may create an accounts-payable block. Ask whether the PO needs correction
    rather than assuming the contract changed.


    User: Can I accept the 48,000 and still pursue 24,000? Their email says payment requires “full and
    final settlement” in the credit-note description.


    Assistant: That language creates a meaningful risk. Do not tell them it is acceptable without professional
    advice. You can decline to issue the requested credit note for now and ask whether they can pay the
    undisputed amount without a full-and-final condition.


    User: I need cash, but I don''t want to waive the rest. I can wait three days to speak to an accountant
    or lawyer. Is there a non-angry reply?


    Assistant: Yes: acknowledge the offer, state that you cannot issue a INR 24,000 credit note or accept
    a full-and-final condition at this time, ask for payment of INR 48,000 without prejudice to the remaining
    balance, and request the calculation plus PO correction.


    User: Drafted: “Thanks, I acknowledge the proposed 48k. Invoice NR-026 remains 72k based on the signed
    scope. I can''t issue the requested credit note or mark this full and final. Please release the undisputed
    48k without that condition and share the 24k calculation. Also please correct PO 7731 to the signed
    total.” Too aggressive?


    Assistant: It is factual and restrained. Add the contract and delivery references, avoid saying they
    acted in bad faith, and give a reasonable reply date. What date do you want?


    User: 6 July by 5 pm. Today is 3 July. Contract has a dispute clause: project leads meet within seven
    days, then mediation in Bengaluru before court. I don''t want to threaten mediation yet.


    Assistant: Agreed. Ask for a project-lead discussion under the ordinary resolution process without
    invoking later stages. Keep mediation as a future option, not part of the first reply.


    User: I sent it at 16:12 and attached contract, appendix A, prototype approval, delivery email, and
    a screenshot of the live dashboard. I did not attach Slack or mention the budget-freeze call.


    Assistant: Good evidence set. Save the sent message and attachments together. Do not alter invoice
    NR-026 while the amount is disputed.


    User: Finance replied automatically: Sneha is out until 6 July, contact ap@clientdomain for urgent
    issues. No human reply yet. PO 7731 is the number. What remains open?


    Assistant: Open items: human response by 6 July 17:00, whether they release INR 48,000 without settlement
    language, their INR 24,000 calculation, correction of PO 7731, and whether you need professional advice
    before accepting any partial-payment terms. The budget-freeze claim remains unverified and private.


    User: update: project lead replied, but only in Slack. She wrote “mobile empty states were always
    in scope; finance is mixing them up with the two tablet variants.” She also said she cannot approve
    payments herself.


    Assistant: Preserve that message with its timestamp and channel. It supports the scope distinction
    but does not itself authorise payment. Keep the signed scope and email approvals as primary evidence.


    User: Timestamp is 6 July 11:18 in #dashboard-redesign. I exported that thread as PDF. She tagged
    finance partner Kunal, who replied with a thumbs-up but no words.


    Assistant: Record the project lead''s statement; do not treat Kunal''s reaction as agreement or approval.
    Has Finance answered the request for its INR 48,000 calculation or the PO correction?


    User: Kunal emailed at 14:06. Says the INR 48,000 was “commercial discretion” and not a screen-by-screen
    calculation. He will ask procurement whether PO 7731 can be raised from INR 2,16,000 to INR 2,40,000.
    No timeline.


    Assistant: That clarifies that the reduction has no supplied scope calculation. PO correction is being
    investigated, not promised. Save the email and ask for an owner and date without accusing anyone of
    changing the contract.


    User: I replied asking for procurement owner and update by 8 July noon. I also repeated that unconditional
    part-payment can be made without accepting full settlement. Was that too much?


    Assistant: It is a factual follow-up. Avoid sending additional messages until that deadline unless
    they ask a question. Did you attach bank or tax details again?


    User: no. They already have those in the vendor portal. I attached nothing this time.


    Assistant: Good. Keep financial details in the approved portal and do not move the conversation to
    personal messaging.


    User: Their product lead called me. I didn''t record it. She said budget freeze is real but applies
    to new change requests, and she thinks final milestone should still be paid. Can I quote the call?


    Assistant: You can write a neutral contemporaneous note and send a short confirmation email: date,
    attendees, and your understanding, inviting correction. Do not present an unrecorded call as an agreed
    written commitment.


    User: I sent: “Thanks for speaking at 15:20. My understanding is the freeze concerns new change requests
    and you believe the contracted final milestone remains payable; please correct me if I misunderstood.”
    She replied “yes, that''s accurate, finance still owns timing.”


    Assistant: That is now written support for the distinction, while payment timing remains unresolved.
    Add both messages to the chronology.


    User: Chronology is getting long: contract 3 March, prototype approval 8 May, final handoff 12 June,
    live 18 June, invoice due 30 June, finance dispute 2 July, my response 3 July, lead/finance messages
    today 6 July.


    Assistant: Keep that chronology. Separate contract evidence, delivery evidence, and later dispute
    correspondence rather than merging screenshots into one unreadable file.


    User: Procurement replied early on 8 July. PO 7731 was created at the wrong value because someone
    entered the post-advance balance as the contract total. They corrected it to INR 2,40,000. Revised
    PO PDF is in the portal.


    Assistant: That resolves the PO discrepancy and removes one accounts-payable blocker. It does not
    confirm the payment date or withdraw Finance''s settlement proposal.


    User: Finance then paid INR 48,000 on 9 July with remittance note “part payment, rights reserved by
    both parties.” I never issued the INR 24,000 credit note. Bank received it this morning.


    Assistant: Update the amounts: INR 2,16,000 total has now been paid, leaving INR 24,000 of invoice
    NR-026 outstanding. The wording and absence of a credit note indicate this was not the full-settlement
    condition previously proposed, but keep the remittance record and avoid a legal conclusion.


    User: They are asking me to join a call Friday about the remaining INR 24,000. I can do 11:00 or 16:00.
    Should I send all evidence again?


    Assistant: Reply with availability and a concise issue list. Link the existing evidence folder rather
    than attaching duplicates. Ask who has authority to agree payment timing and whether procurement or
    Finance will attend.


    User: I chose Friday 11:00. Attendees now show product lead, Kunal from Finance, and procurement manager.
    My accountant says the invoice stays open for INR 24,000. I have not asked a lawyer yet.


    Assistant: Current state for handoff: corrected PO is INR 2,40,000; INR 48,000 unconditional part-payment
    arrived 9 July; NR-026 remains open for INR 24,000; Friday 11:00 discussion is booked with product,
    Finance, and procurement. Open risks are payment timing, whether the client maintains any scope objection
    after the lead''s written clarification, and whether professional legal advice becomes necessary.'
  response_contract:
