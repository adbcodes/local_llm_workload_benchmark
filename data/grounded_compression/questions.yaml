- id: summary_chat_handoff_001
  subcategory: chat_history_handoff
  difficulty: easy
  split: dev
  prompt: 'Compress this short support chat for the next assistant in no more than 75 words. Preserve
    the decision, completed action, corrected contact detail, and open question.


    Source: User: hi, duplicate train booking problem. the app froze after payment and I booked again
    before the first confirmation arrived.


    Assistant: Send the two references, passengers, exact travel date, and which booking you want protected.
    Do not include card details or OTPs.


    User: IR-482771 and IR-482809, both for Nandita Rao and Kiran Rao on train 12658, Friday 7 August
    2026. Keep IR-482771 because it has the lower berths. The second cost INR 3,460.


    Assistant: Understood: protect IR-482771 and ask for fee-waived cancellation only of IR-482809. What
    were the payment and confirmation times?


    User: payments 18:42 and 18:49 yesterday. confirmation for the first came 18:51. I have screenshots.
    The app shows INR 240 cancellation fee per passenger.


    Assistant: Do not use automatic cancellation yet. Raise a duplicate-booking issue with the three timestamps,
    both references, and redacted screenshots. Ask support to waive the fees.


    User: done, case CASE-19308, three screenshots uploaded. It says reply within 48 hours. Nothing cancelled.
    Departure is 22:40 on 7 August; I still need to check the refund cutoff.


    Assistant: Good. Call only if the 48-hour support window could run past that cutoff. Keep the cutoff
    as an open question.


    User: small complication: the form auto-filled old phone ending 1180. Current is 7741; I put 7741
    in the description but can''t edit the submitted form.


    Assistant: Handoff state: CASE-19308 is open, IR-482771 must stay active, and IR-482809 is the only
    cancellation target. If support attempts phone contact, clarify that 7741 is current and 1180 obsolete;
    do not open another case unless the first cannot be updated.'
  response_contract:
