- id: summary_long_incident_001
  subcategory: long_incident_update
  difficulty: medium
  split: test
  prompt: 'Compress this incident update for the payments incident handoff in no more than 85 words. Distinguish
    confirmed impact and recovery from the suspected cause, then retain controls and open owners.


    Source: PAYOUT PROCESSING UPDATE — 3 AUGUST 2026, 18:40 IST


    Samudra Bank rejected 46 payout files submitted from 11:55 onward. The files contained 8,912 merchant
    payouts worth INR 7.84 crore. Rejected rows never left the settlement account; files sent to three
    other banks were accepted normally. No duplicate payout is detected.


    The bank returned “header date invalid,” although the header matched its current guide. Comparison
    with an older accepted file found that today''s filename used a seven-digit sequence after the counter
    rolled over, while the older file used six digits. A manually padded six-digit test was accepted.
    This supports a filename-length hypothesis but does not prove it: Samudra also deployed an undocumented
    validator change, and the test was not a fully controlled pair.


    Incident command approved a temporary six-digit external filename while retaining the complete internal
    sequence and idempotency key. The first retry succeeded. Processing resumed at a capped rate with
    manual review after every acknowledgement and a freeze on unrelated payout changes.


    By 17:30, Samudra had accepted 7,980 payouts. The remaining 932 are in nine files scheduled before
    20:00. Arrival today is not guaranteed even after acceptance. Operations owns completion and the merchant-impact
    list by 20:30. Engineering will run a controlled filename/header matrix by 11:00 on 4 August. Samudra
    ticket SB-440187 must provide release notes, a confirmed cause, and supported filename limits. Finance
    has not decided whether documented late fees qualify for credits. Keep the workaround until bank evidence
    and replay results agree.'
  response_contract:
    type: text
    format: plain_text
  expected:
    value: 'Samudra rejected 46 files covering 8,912 payouts worth INR 7.84 crore; rejected funds did
      not leave, other banks were normal, and no duplicates are detected. A six-digit filename workaround
      restored acceptance: 7,980 payouts were accepted by 17:30, with 932 scheduled before 20:00 under
      capped manual review. Filename length is suspected, not confirmed amid an undocumented validator
      change. Keep the workaround and freeze. Operations owns completion; Engineering tests by 4 August
      11:00; Samudra owes evidence under SB-440187. Arrival and credits remain open.'
