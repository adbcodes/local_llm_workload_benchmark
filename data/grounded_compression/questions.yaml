  subcategory: customer_research
  difficulty: medium
  split: dev
  prompt: 'Summarize the customer research for the design team in no more than 65 words. Separate common
    findings from minority views.


    Source: Researchers interviewed 18 small-business administrators who prepare monthly reports. Fourteen
    said finding the right filters takes too long, and 12 save screenshots because exported files lose
    the visible chart labels. Ten wanted reusable report templates. Five asked for more chart colours,
    while three wanted AI-written commentary. Two participants said the current workflow was already fast
    enough. The sample included existing customers who use reports at least monthly; it did not include
    trial users or large enterprises.'
  response_contract:
    type: text
    format: plain_text
  expected:
    value: Most interviewed administrators struggled with filters (14 of 18), lost chart labels in exports
      (12), and wanted reusable templates (10). Smaller groups requested more colours (5) or AI commentary
      (3), while two found the workflow fast enough. Findings apply to frequent small-business users,
      not trial users or enterprises.
