- id: summary_meeting_incident_001
  subcategory: meeting_transcript
  difficulty: medium
  split: test
  prompt: 'Write an incident-review summary for engineering leadership in no more than 110 words. Separate
    confirmed facts, suspected causes, decisions, and follow-up owners. The audience did not attend the
    meeting.


    Source: PRIYA (Incident lead): Thanks, everyone. This is the review for yesterday''s notification
    delay. We are not assigning blame, and, just to be explicit, the cause is not confirmed yet.


    OMAR (SRE): Customer impact started 09:12 IST and ended 10:04. Push notifications were delayed between
    six and forty-one minutes. Email notifications were normal. We counted 184,220 delayed pushes across
    about 61,000 devices.


    NEEL (Mobile): Did we lose any, or were they all eventually delivered?


    OMAR: We have delivery receipts for 183,907. Three hundred thirteen expired because their time-to-live
    was fifteen minutes. Those were promotional price alerts, not security or transaction messages.


    KAVITA (Support): We had 286 contacts, mostly “sale alert arrived after item sold.” No reports of
    missed OTPs because OTP uses a different provider.


    PRIYA: Good, that''s a confirmed scope distinction. What changed before 09:12?


    OMAR: Queue worker release 2.18 started at 08:50 and reached all workers at 09:07. Cloud provider
    metrics show an availability-zone network event beginning 09:18, six minutes after our first queue
    alarm.


    SAMEER (Backend): Release 2.18 changed batch size from 500 to 2,000 and enabled payload compression.
    In load test it reduced API calls. It also made each retry batch larger.


    NEEL: So the release caused it?


    SAMEER: Maybe contributed. But the first delayed batch was on a worker still reporting 2.17. Clock
    skew could make that version label stale; we have not checked.


    OMAR: Also, queue age rose first in zone b. When we shifted workers away from zone b at 09:39, age
    started falling. We rolled back 2.18 at 09:46, and age kept falling. Since both actions overlap, production
    timing cannot isolate them.


    PRIYA: What is definitely fixed now?


    OMAR: Queue age returned below thirty seconds at 10:04. We are on 2.17, zone b capacity remains at
    twenty percent instead of forty, and alerts have stayed green for twenty-six hours.


    SAMEER: There is a hidden limit I found this morning. The provider API allows 1,200 compressed messages
    per request for our account, not 2,000. Requests above that are accepted, then partially retried.
    Documentation says limits vary by contract.


    PRIYA: Is that confirmed from support?


    SAMEER: Confirmed from our response headers and a provider ticket reply, yes. But it does not explain
    the 2.17 worker unless the label was stale or zone networking caused independent retries.


    KAVITA: Are we sending customers a notice?


    PRIYA: Status page already says delayed promotional pushes, resolved, no transaction or security notifications
    affected. Do we need direct mail?


    KAVITA: I don''t recommend it. The affected alerts are non-critical, and direct mail could cause more
    confusion. We should give agents a credit rule for customers who bought after a late price alert.


    MEERA (Product): Agree. Credit only when the order timestamp is after the offer ended and the alert
    receipt is late. Cap at INR 500?


    KAVITA: INR 500 account credit, one per affected account, with the alert ID attached. I can publish
    the macro today.


    PRIYA: Decision. Now action items.


    OMAR: I will add zone-level queue-age alerts and preserve worker-version labels from the deployment
    service, due Friday. We currently scrape the process label, which may lag.


    SAMEER: I will build a replay test that separates batch size, compression, and zone latency. Results
    by Monday. Until then, batch size stays 500 and compression stays off.


    NEEL: Mobile can expose received-at versus sent-at in the internal diagnostics screen. That is useful,
    but it is not needed for root cause.


    PRIYA: Put that in the backlog, no deadline. Provider follow-up?


    OMAR: Ticket CP-88214 is open. We asked for zone-b packet-loss timing and written confirmation of
    the 1,200 limit.


    MEERA: One concern: marketing wants the weekend campaign. Are pushes safe?


    OMAR: Current metrics are normal at expected weekend volume. I recommend proceeding with a staffed
    watch, not claiming risk is zero.


    PRIYA: Decision: campaign proceeds, SRE staffed for the first two hours. Rollback remains in place.
    Root cause stays “under investigation”; leading contributors are oversized compressed batches and
    the zone-b event, but neither alone is proven.


    KAVITA: Macro and credit rule by 16:00 today.


    PRIYA: Great. I will circulate the review and schedule the Monday evidence check.'
  response_contract:
    type: text
    format: plain_text
  expected:
    value: 'Confirmed: 184,220 pushes to about 61,000 devices were delayed 6–41 minutes from 09:12–10:04
      IST; 313 promotional alerts expired. Email, OTP, security, and transaction messages were unaffected.
      Recovery followed zone-b capacity reduction and release rollback, so causality is unresolved. Oversized
      compressed batches and a zone-b network event are leading contributors, not proven root causes.
      Campaign proceeds with two hours of staffed SRE watch; batch size stays 500 and compression off.
      Omar owns alerts/version evidence and provider ticket CP-88214; Sameer runs replay tests by Monday;
      Kavita publishes the INR 500 credit rule by 16:00 today.'
