- id: summary_proposal_001
  subcategory: tradeoff_brief
  difficulty: hard
  split: dev
  prompt: 'Summarize the proposal for the steering group in no more than 80 words. Compare both options,
    include the major assumptions, and identify the decision needed.


    Source: The team must choose how to archive seven years of audit logs. Option A keeps the current
    vendor and moves older logs to its cold tier. It costs an estimated USD 74,000 annually, needs about
    three weeks of engineering work, and restores archived data in four to eight hours. Option B moves
    archives to object storage, costs an estimated USD 39,000 annually, and takes eight to twelve weeks
    to build. Its restore estimate is two to six hours, but this has only been tested on one month of
    data. Compliance requires retrieval within 12 hours and has approved either design. Option A''s quote
    is fixed through December; Option B''s estimate excludes ongoing maintenance. The team needs a decision
    by 15 October to complete either path before the current retention exception ends in January.'
  response_contract:
    type: text
    format: plain_text
  expected:
    value: Option A costs about USD 74,000 yearly, needs three weeks, and restores in four to eight hours.
      Option B is estimated at USD 39,000 plus unpriced maintenance, needs eight to twelve weeks, and
      has a two-to-six-hour restore estimate tested on only one month. Both meet the 12-hour compliance
      limit. The steering group must choose by 15 October to finish before January.
  scoring:
    method: llm_judge
    parameters:
      rubric: grounded_summary_v1
      pass_threshold: 0.7
      minimum_faithfulness: 3
      max_words: 80
  provenance:
    kind: hand_authored
    review_status: draft
    generator: grounded_compression_v2
    seed: 20260803
  tags:
  - summarization
  - groundedness
  - tradeoff_brief
