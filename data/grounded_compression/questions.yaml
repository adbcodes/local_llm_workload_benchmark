- id: summary_meeting_launch_001
  subcategory: meeting_transcript
  difficulty: medium
  split: dev
  prompt: 'Summarize this short launch meeting for product, support, and risk leads in no more than 80
    words. Separate the conditional decision from readiness work and stop conditions.


    Source: Ritu: Okay, we have twenty minutes. This is a beta decision, not a public-launch meeting.
    Can we expose the new family payment flow on Thursday?


    Dev: Checkout totals match the old flow in our test accounts. Safari 17 still waits several seconds
    after the bank redirect, but the payment completes and refresh shows the receipt. The duplicate-charge
    tests passed.


    Leena: Support can cover a small cohort. The help article still says the receipt appears immediately,
    so that line must change before invitations go out.


    Arun: I want explicit stop conditions. Any duplicate charge stops the beta. I also propose stopping
    if payment-acceptance failures exceed five percent or more than ten distinct Safari accounts contact
    support.


    Ritu: Cohort proposal is 100 randomly selected eligible accounts. Two accounts in the draft list have
    no documented contact basis, so exclude them. This does not approve public release.


    Dev: I can update the invite copy and help article by 17:00 today, then run the production smoke test
    tomorrow morning.


    Leena: I will update the support macro by noon tomorrow and tag contacts family_beta. We need unique
    accounts, not number of tickets.


    Arun: I will write the stop-condition query and owner rotation by 11:00 tomorrow. Acceptance failure
    means a bank-authorised payment that our service does not record successfully; user cancellations
    do not count.


    Ritu: Decision is a conditional go for Thursday at 14:00 IST, provided smoke testing and those readiness
    tasks pass. I will select the 100 accounts by 18:00 today and watch invitation failures.


    Dev: Fine. Safari delay remains a known issue, not a blocker for this limited beta. Public launch
    comes back to this group with beta evidence.'
