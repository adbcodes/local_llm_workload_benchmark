  visibility: public
- id: summary_study_001
  subcategory: conflicting_evidence
  difficulty: hard
  split: test
  prompt: 'Summarize the evidence for a non-technical decision maker in no more than 80 words. Explain
    where the studies agree, where they differ, and why no firm conclusion is possible.


    Source: Three internal analyses examined whether optional focus hours improve delivery speed. The
    first compared six teams before and after adoption and found cycle time fell 12%, but those teams
    also hired more senior engineers. The second compared eight adopting teams with eight non-adopting
    teams and found no meaningful cycle-time difference, although policy use varied widely. The third
    surveyed 420 employees: 71% reported fewer interruptions, while 38% said meeting availability became
    harder. All three found no clear change in defect rate. None randomly assigned teams, and the analyses
    covered only one quarter. Leadership is considering a six-month controlled pilot rather than a company-wide
    policy.'
  response_contract:
    type: text
    format: plain_text
  expected:
    value: The analyses agree that focus hours showed no clear defect-rate change. One found 12% faster
      cycles but was confounded by senior hiring; a matched comparison found no meaningful speed difference
      amid uneven policy use. Employees mostly reported fewer interruptions, though 38% found meetings
      harder. Non-random assignment and one-quarter duration prevent a firm conclusion, supporting a six-month
      controlled pilot.
  scoring:
    method: llm_judge
    parameters:
      rubric: grounded_summary_v1
      pass_threshold: 0.7
      minimum_faithfulness: 3
      max_words: 80
  provenance:
    kind: hand_authored
    review_status: draft
    generator: grounded_compression_v2
    seed: 20260803
  tags:
  - summarization
  - groundedness
  - conflicting_evidence
  - pointwise_judge
  visibility: held_out
- id: summary_launch_001
  subcategory: multi_stakeholder
  difficulty: hard
  split: dev
  prompt: 'Write a launch-readiness summary in no more than 80 words for product, support, and engineering
    leads. Include ready areas, blockers, workarounds, and the decision point.


    Source: The new billing portal passed functional and load testing, and finance validated invoice totals
    against 2,000 historical accounts. Translation is complete for English, Hindi, and Spanish, but German
    legal text is awaiting approval. Support has trained 42 of 50 agents; the remaining eight work the
    weekend shift and train Friday. A known issue causes saved bank details to display slowly for about
    3% of users, though payments still complete; engineering has a fix in review and can disable saved
    details as a workaround. Marketing has scheduled email for Monday at 09:00. The launch group meets
    Friday at 16:00 to decide whether to launch Monday, limit launch to approved languages, or delay.'
  response_contract:
    type: text
    format: plain_text
  expected:
    value: Functional, load, and invoice checks passed; three languages are ready, and 42 of 50 support
