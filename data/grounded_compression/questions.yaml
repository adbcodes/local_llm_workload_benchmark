- id: summary_long_audit_001
  subcategory: long_audit_update
  difficulty: hard
  split: test
  prompt: 'Prepare a risk-committee brief in no more than 150 words. Separate verified findings, evidence
    limits, containment, suspected exposure, and dated follow-ups.


    Source: ACCESS REVIEW — REGIONAL PARTNER PORTAL

    Draft 4, 2 August 2026

    Distribution: Risk Committee, Security, Partner Operations


    The review examined access to the Regional Partner Portal after an internal control reported that
    partner departures were not always reaching the identity system. The review period covered 1 January
    through 30 June 2026. Auditors obtained complete account exports for the India, Singapore, and United
    Arab Emirates instances. The South Africa instance could not produce a historical role export because
    its audit plug-in stopped writing role-change events on 11 March. Current South Africa accounts were
    reviewed, but historical access there is not verified.


    Across the three complete instances, auditors matched 4,812 portal accounts against partner rosters
    and contract end dates. They verified 63 accounts that remained enabled after the associated person’s
    recorded end date. The excess period ranged from one to 74 days, with a median of nine days. Forty-eight
    accounts had read-only access to shipment status and partner contact details. Fifteen could also download
    monthly invoice PDFs for their own partner organisation. None had administrator rights, could change
    bank details, or could view another partner’s records under the permissions exported for this review.


    Authentication logs were available for 58 of the 63 accounts. Five accounts belong to an acquired
    partner whose logs were retained in a system that has not yet been restored; their post-departure
    use is unknown. Of the 58 with logs, four were used after the recorded end date. Three uses came from
    the same office IP addresses used before departure and downloaded shipment-status CSV files. One account
    logged in from a new residential network and downloaded two invoice PDFs. The review confirms the
    logins and downloads but does not establish who controlled the credentials. Partner Operations has
    contacted the four organisations. Two confirmed that shared team leads continued using the accounts;
    two have not answered.


    No evidence shows bank-detail changes, cross-partner access, or administrator activity. That statement
    is limited to available portal logs and exported permissions. The investigation has not reviewed files
    after download, endpoint devices, forwarded documents, or activity in the unavailable acquired-partner
    logs. It is therefore inaccurate to say there was no data exposure. Verified downloaded data was limited
    to shipment-status rows and two invoices, while any onward use remains unknown.


    All 63 accounts were disabled by 29 July. Security invalidated active sessions and reset API tokens
    linked to 11 of the accounts. A temporary daily comparison now matches enabled accounts to the central
    partner roster. Exceptions require approval from both the regional operations manager and Security
    and expire after seven days. This control covers the India, Singapore, and UAE instances. South Africa
    is running a manual twice-weekly review until its audit plug-in is repaired.


    The process failure has two confirmed elements. First, 27 partner organisations submitted departure
    updates through free-text email rather than the required roster template; the operations mailbox had
    no service-level target for processing them. Second, a June workflow change stopped copying regional
    identity teams on contract-closure tickets. It is not yet known how many of the 63 delayed closures
    were caused by each issue. Staff turnover and training gaps have been mentioned in interviews but
    are not supported by sufficient evidence and should remain hypotheses.


    The South Africa limitation is material. Current review found six accounts whose users were absent
    from the latest roster; all six were disabled on 30 July. Because historical role and event data after
    11 March are incomplete, auditors cannot determine how long they were active, whether permissions
    changed, or whether they were used after departure. Database login logs may partially reconstruct
    activity, but they do not include downloaded file names.


    Follow-up ownership is recorded. Partner Operations will obtain written responses from the two organisations
    with unexplained post-departure use by 5 August and confirm whether the downloaded files were retained.
    Identity Engineering will restore the acquired-partner logs by 8 August and repair South Africa’s
    audit plug-in by 12 August. Internal Audit will sample 100 closures from July after the new daily
    control has operated for a month, reporting on 7 September. Legal will assess notification obligations
    only after the four unexplained or partially explained account cases and missing logs are resolved.


    The committee is asked to approve keeping the portal open under temporary controls rather than suspending
    all partner access. Security supports continued operation because high-risk permissions were absent
    and containment is complete for known accounts, but rates residual risk medium due to incomplete logs
    and uncertain credential control. Internal Audit agrees provided the South Africa repair date and
    September effectiveness test remain formal tracked actions.


    APPENDIX A — SAMPLE AND DATA LIMITATIONS


    The 4,812-account match used partner rosters received by 15 July. Eleven partners supplied spreadsheets
    with locally formatted dates; Audit normalized them and retained the originals. A second auditor reviewed
    every matched departure behind the 63 confirmed accounts. Records with only an unverified nickname
    match were excluded rather than counted as findings. This reduces false positives but means an account
    under a substantially different name may remain outside the result.


    The permissions conclusion comes from role exports, not screen-by-screen attempts. Audit tested representative
    read-only and invoice roles in the India instance and observed the expected restrictions. It did not
    impersonate all 63 users in production. The absence of administrator, bank-change, and cross-partner
    permissions is verified against available role mappings and logs, but a defect outside those sources
    would not have been detected by this review.


    The two invoice PDFs downloaded by the residential-network login contain the partner''s own billing
    address, tax registration, service description, and monthly amount. They do not contain card or bank-account
    details. Legal has not decided whether the downloads require notification because credential ownership
    and onward sharing are still unknown.


    South Africa''s audit plug-in repair has a tested rollback plan but has not yet been deployed. The
    12 August date includes a two-day observation period. Until the repair produces complete events, the
    twice-weekly manual review remains a compensating control rather than proof that historical exposure
    is absent.


    The committee secretary asked whether “containment complete” can appear in external language. Security
    advised using “known affected accounts have been disabled and active sessions invalidated.” That wording
    stays within verified scope and does not imply that missing logs or downstream copies have been resolved.'
  response_contract:
    type: text
    format: plain_text
  expected:
    value: Audit verified 63 late-disabled accounts across three complete regions; four were used after
      departure, including shipment CSV and two invoice downloads. Available roles and logs show no admin,
      bank-change, or cross-partner access, but they cannot resolve credential control, onward use, five
      acquired-partner logs, unmatched identities, or South Africa history. Six additional South Africa
      accounts were disabled. All known accounts, sessions, and linked tokens are contained; daily matching
      and manual reviews operate. Confirmed failures involve free-text departures and a June ticket-routing
      change; training gaps are only suspected. Operations follows up by 5 August, logs by 8 August, South
      Africa repair by 12 August, and control testing by 7 September. Residual risk is medium; external
      wording must say known accounts are contained, not imply all exposure is resolved.
