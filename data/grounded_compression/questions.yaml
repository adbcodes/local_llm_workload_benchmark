- id: summary_long_budget_001
  subcategory: long_budget_update
  difficulty: medium
  split: dev
  prompt: 'Summarize this budget update for the board finance committee in no more than 115 words. State
    the forecast, confirmed drivers, assumptions, decisions already taken, and choices still required.


    Source: Q2 OPERATING FORECAST — CUSTOMER OPERATIONS

    Prepared for the 6 August 2026 finance review


    The approved annual budget for Customer Operations is INR 18.40 crore. Actual spend through June is
    INR 9.62 crore, compared with a straight-line half-year budget of INR 9.20 crore. The current full-year
    forecast is INR 19.18 crore, or INR 78 lakh above plan. This forecast includes actions already approved
    in July but excludes any new programme discussed below. It is not a cash-flow forecast; vendor payment
    timing may move between months.


    The largest confirmed variance is temporary staffing. The original plan assumed an average of 42 temporary
    agents from April through September. Actual staffing averaged 58 after two product migrations generated
    more contacts than forecast. The extra staffing cost through June is INR 31 lakh. Contact volume has
    now fallen, and Operations ended 12 contracts on 31 July. The forecast assumes eight more contracts
    end on 31 August and the remaining temporary pool returns to 42 agents in September. If contact volume
    stays above 118,000 cases per month, those eight contracts may need to continue; each additional month
    would add approximately INR 6.8 lakh.


    Translation spend is INR 17 lakh above plan. Product teams launched four help-centre collections that
    were not included in the operating plan, covering Hindi, Tamil, Bengali, and Marathi. The invoices
    and completed word counts have been verified. A further INR 9 lakh is forecast for planned releases
    through December. That figure assumes product teams freeze source copy ten business days before launch.
    Late copy changes are billed again and could add INR 2–5 lakh; no contingency for repeated translation
    is included.


    Telephony is INR 11 lakh below plan because more customers used in-app calling. This saving is confirmed
    through June. The forecast assumes the lower run rate continues, although a telecom price increase
    of up to 6% is under consultation and has not been announced. The model uses the current tariff, not
    the possible higher rate.


    The knowledge-base platform is another decision point. The existing contract costs INR 54 lakh annually
    and renews 1 October. The vendor offered a new AI-search module for an additional INR 18 lakh. A six-week
    internal trial with 22 agents reduced median lookup time from 96 seconds to 71 seconds, but resolution
    time did not change measurably, and the trial did not include new hires. Operations recommends renewing
    the base platform but not buying the module this year. The forecast includes the base renewal at the
    current price; procurement has not yet received a binding renewal quote, so inflation risk remains.


    Training is INR 8 lakh under plan because the June induction cohort moved to August. This is timing,
    not a saving: the expense is included in the second half. Travel is INR 6 lakh under plan and is treated
    as a permanent saving after three regional meetings moved online. Facilities spend is on plan. No
    severance, restructuring, or office expansion is assumed.


    Management has already frozen non-essential travel, stopped the 12 temporary contracts, and required
    finance approval for translation changes after source freeze. Together, these actions reduce the forecast
    by INR 29 lakh compared with the unmitigated July estimate. These are implemented decisions, not proposals.


    The committee still needs to decide three items. First, whether to hold a INR 20 lakh central contingency
    for temporary staffing and translation rework; adding it would increase the forecast overrun from
    INR 78 lakh to INR 98 lakh but avoid unfunded requests later. Second, whether to authorise procurement
    to renew the knowledge-base base plan up to a ceiling of INR 58 lakh; the current forecast carries
    INR 54 lakh. Third, whether product teams, rather than Customer Operations, should fund translation
    caused by post-freeze changes from September onward.


    Finance recommends the INR 20 lakh contingency, base renewal authority up to INR 58 lakh, and chargeback
    for avoidable translation rework. Operations supports the contingency and renewal but wants a one-month
    warning before chargeback begins. The forecast should be refreshed on 10 September after August contact
    volume, temporary staffing decisions, and the binding platform quote are known.'
