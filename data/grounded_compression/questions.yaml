- id: summary_incident_001
  subcategory: operational_update
  difficulty: medium
  split: test
  prompt: 'Summarize the operational update for an engineering manager in no more than 60 words. Prioritize
    customer impact, current status, and the next decision. Clearly distinguish confirmed facts from the
    suspected cause.


    Source: At 10:15 IST, monitoring showed elevated checkout latency shortly after the recommendation-service
    release that began at 10:05. Eighteen percent of checkout requests took longer than two seconds, compared
    with a normal rate below three percent. The service returned no additional errors, no payments were
    duplicated, and no customer data was lost. Engineers rolled back the release at 10:32, and latency
    returned to baseline by 10:41. Eleven customers contacted support about slow checkout confirmation.
    A cache warm-up configuration is the leading suspected cause, but this has not been confirmed. The
    infrastructure team is reviewing traces and will decide by 16:00 whether the release can be retried
    the following day. Customers do not need to take any action.'
  response_contract:
    type: text
    format: plain_text
  expected:
    value: Checkout latency rose after the recommendation-service release, with 18% of requests exceeding
      two seconds but no additional errors, duplicate payments, or data loss. Rollback restored baseline
      performance by 10:41. A cache warm-up configuration is suspected but unconfirmed; infrastructure
      will review traces and decide by 16:00 whether to retry tomorrow.
  scoring:
    method: llm_judge
    parameters:
      rubric: grounded_summary_v1
      pass_threshold: 0.7
      minimum_faithfulness: 3
      max_words: 60
  provenance:
    kind: hand_authored
    review_status: human_checked
    generator: grounded_compression_v2
    seed: 20260803
  tags:
  - summarization
  - groundedness
  - operational_update
  - pointwise_judge
  visibility: held_out
- id: summary_experiment_001
  subcategory: experiment_result
  difficulty: medium
  split: dev
  prompt: 'Summarize the experiment for a product manager in no more than 60 words. State the result,
    important limits, and recommended decision.


    Source: A two-week checkout experiment showed the shorter form to 20,400 visitors and the current
    form to 20,180. Purchase completion was 4.8% on the shorter form and 4.5% on the current form. The
    0.3 percentage-point lift was statistically significant at the team''s preset 95% threshold. Mobile
    users showed most of the gain; desktop results were flat. Refund rate and support contacts did not
    change. The test excluded returning subscribers and ran only in India. The analytics team recommends
    rolling out to new Indian customers while running a separate test for subscribers and other countries.'
  response_contract:
    type: text
    format: plain_text
  expected:
    value: The shorter checkout raised completion from 4.5% to 4.8%, meeting the preset significance threshold,
      with gains concentrated on mobile and no change in refunds or support contacts. Because the India-only
      test excluded returning subscribers, roll it out to new Indian customers while testing other users
      separately.
  scoring:
    method: llm_judge
    parameters:
      rubric: grounded_summary_v1
      pass_threshold: 0.7
      minimum_faithfulness: 3
      max_words: 60
  provenance:
    kind: hand_authored
    review_status: draft
    generator: grounded_compression_v2
    seed: 20260803
  tags:
  - summarization
  - groundedness
  - experiment_result
  - pointwise_judge
  visibility: public
- id: summary_budget_001
  subcategory: decision_brief
  difficulty: medium
  split: test
  prompt: 'Summarize this request for the finance approver in no more than 65 words. Include cost, expected
    benefit, uncertainty, and the decision deadline.


    Source: The support team requests INR 9.6 lakh for a one-year knowledge-base tool covering 40 agents.
    The vendor estimates a 15% reduction in average handling time, but this estimate comes from its own
    customer study and has not been tested internally. A four-week trial with eight agents reduced handling
    time by 9% and did not change satisfaction scores. Integration would require about six engineering
    days. The discounted quote expires 30 September. Finance must decide by 25 September to leave time
    for security review.'
  response_contract:
    type: text
    format: plain_text
  expected:
    value: Support requests INR 9.6 lakh for one year. An eight-agent trial cut handling time 9% with
      no satisfaction change, below the vendor's unverified 15% estimate; integration needs about six
      engineering days. Finance should decide by 25 September, ahead of security review and the 30 September
      quote expiry.
  scoring:
