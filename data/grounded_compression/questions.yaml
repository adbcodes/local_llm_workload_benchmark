    that 17 accounts belonging to former contractors remained enabled between 4 and 29 days after contract
    end; logs show no use of those accounts after departure. Nine of the 17 had read access to customer
    metadata, while none could view payment details. All 17 accounts were disabled during the audit. The
    review did not cover two legacy systems because their account exports failed, so their exposure is
    unknown. Human Resources and IT records disagreed on 23 contractor end dates. Security has added a
