schema_version: 2
name: local-llm-final-benchmark-catalog
suites:
  - id: A
    title: Core Capability
    question: Can it reason and repair code?
    scoring: Exact answers and isolated Python tests
  - id: B
    title: Structured Work
    question: Can it extract data and choose tools?
    scoring: Exact JSON and tool-call checks
  - id: C
    title: Instruction Control
    question: Can it follow cumulative constraints?
    scoring: Data-driven rule and content checks
  - id: D
    title: Grounded Communication
    question: Can it compress source material faithfully?
    scoring: Deterministic checks plus a calibrated LLM judge
  - id: E
    title: Long-Context Reliability
    question: Can it retrieve evidence from difficult long documents?
    scoring: Exact evidence-grounded answers
benchmarks:
  - {id: applied_reasoning, suite: A, status: complete, kind: question_set, definition_path: applied_reasoning/benchmark.yaml}
  - {id: code_debug_repair, suite: A, status: complete, kind: question_set, definition_path: code_debug_repair/benchmark.yaml}
  - {id: messy_text_to_schema, suite: B, status: complete, kind: question_set, definition_path: messy_text_to_schema/benchmark.yaml}
  - {id: tool_use, suite: B, status: complete, kind: question_set, definition_path: tool_use/benchmark.yaml}
  - {id: email_to_action, suite: B, status: complete, kind: question_set, definition_path: email_to_action/benchmark.yaml}
  - {id: constraint_load_curve, suite: C, status: complete, kind: question_set, definition_path: constraint_load_curve/benchmark.yaml}
  - {id: grounded_compression, suite: D, status: complete, kind: question_set, definition_path: grounded_compression/benchmark.yaml}
  - {id: long_text_retrieval, suite: E, status: complete, kind: question_set, definition_path: long_text_retrieval/benchmark.yaml}
evaluation_files:
  scoring_contracts: evaluation/scoring_contracts.yaml
  normalization: evaluation/normalization.yaml
  reporting: evaluation/reporting.yaml
probe_sets: []
