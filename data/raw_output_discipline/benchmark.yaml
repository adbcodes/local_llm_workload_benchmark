id: raw_output_discipline
title: Raw Output Discipline
description: Produce exact machine-readable output without fences, preambles, or trailing explanations.
suite: C
status: started
execution_mode: single_turn
task_types:
- raw JSON
- raw CSV
- single labels
- no preamble
- no code fences
- no trailing explanation
metrics:
- parseability
- fence_wrapping_rate
- extra_chatter_rate
- value_accuracy
score_formula: mean_score
evaluation_policy:
  primary_outcome: protocol
  primary_metric: protocol_pass_rate
  protocol_requirement: required
  partial_credit_metric: mean_protocol_score
items_path: items.jsonl
authoring_paths:
- questions.yaml
current_question_count: 10
target_question_count: 10
current_difficulty_distribution:
  easy: 3
  medium: 5
  hard: 2
difficulty_distribution:
  easy: 3
  medium: 5
  hard: 2
target_visibility_distribution:
  public: 5
  held_out: 5
order_rule: easy_to_hard
scoring_methods:
- json_exact
- exact_match
- constraint_rules
