schema_version: 1
id: judge_panel_v1
status: implemented
applies_to: [communication_clarity, hinglish_quality]
requirements:
  judge_count: 3
  first_pass_judges: 2
  tie_break_judge: 1
  different_model_families: true
  candidate_family_cannot_judge_itself: true
  temperature: 0
  structured_json_verdicts: true
  unparseable_verdict_is_judge_failure: true
validation:
  hand_graded_answers: 25
  agreement_metric: cohens_kappa
verdict_fields: [criteria, critical_error, overall_pass, reason]
