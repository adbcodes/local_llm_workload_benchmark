schema_version: 2
id: scoring_contracts_v2
contract_rule: Each method evaluates a parsed value; benchmark policy decides whether semantic, protocol, or integration success is primary.
methods:
  exact_match:
    use_for: one exact text label or answer
    expected_value: scalar
    accepted_answer_contracts: [scalar_text, option_label]
  numeric_tolerance:
    use_for: arithmetic and table totals
    expected_value: number
    accepted_answer_contracts: [number]
    parameters: {absolute_tolerance: 0, allow_surrounding_text: false}
  rational_value:
    use_for: fractions and exact ratios
    expected_value: fraction string
    accepted_answer_contracts: [number]
  date_value:
    use_for: calendar and normalized date answers
    expected_value: YYYY-MM-DD
    accepted_answer_contracts: [date]
    semantic_recovery: A unique YYYY-MM-DD date inside a timestamp is usable while the timestamp remains a format violation.
  json_exact:
    use_for: structured extraction and raw JSON
    expected_value: object or array
    accepted_answer_contracts: [json]
    reports: [protocol_compliance, leaf_accuracy, normalized_leaf_accuracy, missing_paths, extra_paths]
  set_match:
    use_for: unordered row IDs or multiple labels
    expected_value: list of strings
    accepted_answer_contracts: [set]
    parameters: {separator: ',', case_sensitive: true}
  behavior_rules:
    use_for: abstention, clarification, false premises, and over-refusal
    expected_value:
      decision: one declared behavior decision
      reference_answer: one answer proving the contract is satisfiable
      evidence_patterns: [item-specific regular expressions]
      forbidden_patterns: [regular expressions for contradictory behavior]
    accepted_answer_contracts: [scalar_text]
    reports: [behavior_decision, matched_decision_patterns, matched_evidence_patterns, matched_forbidden_patterns]
  constraint_rules:
    use_for: composed positive, negative, format, and ordering instructions
    expected_value: reference answer proving satisfiability
    accepted_answer_contracts: [scalar_text]
    content_checkers:
      json_records: exact record multiset with object-key order and array-record order ignored
    semantic_rule: Natural-language facts and tone are adjudicated separately; mechanical rules remain deterministic.
    reports: [content_score, per_rule_checks, rule_compliance, semantic_requirements]
  executable_python:
    use_for: implementation and repair
    expected_value: {entry_point: function_name, tests: []}
    accepted_answer_contracts: [code]
    reports: [tests_passed, tests_total, timeout, error]
  tool_call:
    use_for: single-turn tool selection, exact arguments, and direct no-tool answers
    expected_value:
      tool_required: {tool_call: tool_name, arguments: {argument: value}}
      no_tool: {tool_call: null, arguments: {}, answer: direct_answer}
    parameters:
      direct_answer_patterns: diagnostic item-specific patterns for no-tool explanations; the semantic judge is authoritative for meaning
    argument_rule: Argument names, JSON types, values, nested object keys, and list order must match exactly.
    accepted_answer_contracts: [tool_call]
    reports: [parseable, tool_choice_accuracy, argument_accuracy, stop_continue_accuracy, explanation_accuracy, format_compliant]
  tool_trace:
    use_for: tool selection, arguments, order, and final fake-environment state
    expected_value:
      calls:
        - {tool: tool_name, arguments: {argument: value}}
      observations:
        - {result_key: value_returned_by_fake_tool}
      final_state: {state_key: value}
    accepted_answer_contracts: [tool_trace]
    reports: [parseable, tool_choice_accuracy, argument_accuracy, order_ok, observation_use_accuracy, unnecessary_calls_ok, final_state_accuracy]
  confidence_value:
    use_for: an answer followed by confidence from 0 to 100
    expected_value: {answer: replace_gold_answer}
    required_output: "<answer> followed by last line confidence: NN"
    semantic_recovery: An unlabelled but unambiguous final confidence number is usable while the missing label remains a protocol violation.
    accepted_answer_contracts: [confidence]
    reports: [answer_correct, confidence, brier_component]
  llm_judge:
    use_for: fact-safe summaries plus semantic instruction and tool-explanation adjudication
    expected_value: human-written reference answer
    accepted_answer_contracts: [scalar_text]
    reports: [faithfulness, coverage, relevance, clarity, concision, judge_usage]
