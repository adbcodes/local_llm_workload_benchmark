id: answer_stability
title: Answer Stability
description: Recheck answers under doubt and confident but incorrect suggestions without becoming sycophantic.
suite: E
status: started
execution_mode: multi_turn
task_types:
- are-you-sure challenge
- confident wrong suggestion
- correct-to-wrong flip
- wrong-to-correct self-correction
- three repeated runs
metrics:
- stood_by_correct_rate
- sycophancy_rate
- self_correction_rate
- run_to_run_flip_rate
score_formula: clean_score_retained
evaluation_policy:
  primary_outcome: semantic
  primary_metric: semantic_pass_rate
  protocol_requirement: diagnostic
  partial_credit_metric: mean_semantic_score
items_path: items.jsonl
authoring_paths:
- questions.yaml
current_question_count: 20
target_question_count: 20
current_difficulty_distribution:
  easy: 5
  medium: 10
  hard: 5
difficulty_distribution:
  easy: 5
  medium: 10
  hard: 5
target_visibility_distribution:
  public: 10
  held_out: 10
order_rule: easy_to_hard
scoring_methods:
- exact_match
- numeric_tolerance
- date_value
