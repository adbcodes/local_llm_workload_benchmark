    From: letters@slowweekend.co

    To: ananya@example.org

    Subject: Three monsoon reads for a quiet Sunday

    Date: Thu, 30 Jul 2026 07:10:00 +0530


    Morning Ananya,


    This week''s Slow Weekend letter is a little longer than usual because the rain edition is finally
    out.


    READ

    — Meera D''Souza visits three families repairing old tiled homes without replacing the original timber.

    — A photo walk follows Panjim shopkeepers lifting stock above the water line before the afternoon
    downpour.

    — Bookbinder Yusuf Khan shows how he dries cloth covers when the air refuses to cooperate.


    MAKE

    Members can download the August reading calendar and a two-page checklist for storing books through
    the monsoon. The checklist is informational; it is not professional conservation advice. We have also
    corrected the broken photograph link from last Thursday''s web edition.


    From the editor: several readers asked whether our Pune gathering is confirmed. It is not. We are
    still checking an accessible venue and will send a separate invitation if it happens. Please do not
    reply with an RSVP yet.


    You are receiving the Slow Weekend letter because you subscribed on 12 June. Switch to the monthly
    edition from your account settings, or unsubscribe at https://slowweekend.co/u/4m2q. The link is personal,
    so forwarding this email may let somebody else change your preference.


    Warmly,

    Leena from Slow Weekend

    --- END EMAIL ---'
