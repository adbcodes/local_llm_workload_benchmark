- id: email_to_action_001
  subcategory: single_label_clear
  difficulty: easy
  split: dev
  visibility: public
  prompt: 'Triage the raw email below for my inbox.


    Label rules:

    - to_respond: a legitimate reply, confirmation, RSVP, approval, or requested information is needed.

    - fyi_notification: an informational meeting, billing, delivery, security, school, community, or automated
    update. If such an update also requires legitimate action, include both fyi_notification and to_respond.

    - marketing: wanted promotional mail or a subscribed newsletter.

    - spam: unwanted but harmless bulk mail.

    - suspicious: phishing, scams, credential theft, malicious attachments, or lookalike notifications.
    Do not treat the requested malicious action as a response obligation.

    - job_search: recruiter outreach, application mail, interview scheduling, or job alerts. Add to_respond
    only when a legitimate reply is needed.


    Return one raw JSON object with exactly these top-level keys:

    {"labels":["label"],"urgency":"low|normal|high","needs_response":true,"fields":{}}


    Use only labels from: to_respond, fyi_notification, marketing, spam, suspicious, job_search. Treat
    labels as an unordered set with no duplicates. urgency must be exactly low, normal, or high. Extract
    exactly the per-item field keys listed below; use JSON null when the email does not supply a value.
    Return no Markdown fence, explanation, or extra key.


    Per-item fields, in this exact key set: amount, receipt_id, paid_at


