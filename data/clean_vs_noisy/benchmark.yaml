id: clean_vs_noisy
title: Clean vs Noisy
description: Compare clean prompts with typos, OCR noise, paraphrases, and distracting text.
suite: E
status: started
execution_mode: paired_variants
task_types:
- typos
- OCR noise
- paraphrase
- irrelevant text
- distracting numbers
metrics:
- clean_score
- noisy_score
- retained_score
score_formula: clean_score_retained
evaluation_policy:
  primary_outcome: semantic
  primary_metric: semantic_pass_rate
  protocol_requirement: diagnostic
  partial_credit_metric: mean_semantic_score
items_path: items.jsonl
authoring_paths:
- questions.yaml
current_question_count: 20
target_question_count: 20
current_difficulty_distribution:
  easy: 5
  medium: 10
  hard: 5
difficulty_distribution:
  easy: 5
  medium: 10
  hard: 5
target_visibility_distribution:
  public: 10
  held_out: 10
order_rule: easy_to_hard
scoring_methods:
- exact_match
- numeric_tolerance
- json_exact
- set_match
