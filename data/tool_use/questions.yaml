      [19 Jul] #power backup

      Megha: The generator supports lighting and core network loads but not every desk socket or the pantry
      induction units.

      Follow-up: IT and facilities need one common list of circuits that remain live during an outage.

      Thread note: A later call clarified the wording but did not change the owner or the follow-up recorded
      here.


      [21 Jul] #move waves

      Tenzin: Customer support asked to move on the second weekend because the first weekend overlaps
      its quarterly release.

      Follow-up: the sequence must keep at least one support pod operational at either site throughout
      Monday.

      Thread note: The amount and date in the quoted email are provisional until the named owner posts
      a confirmation.


      [23 Jul] #signage

