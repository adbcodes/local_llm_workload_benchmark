      another two weeks.

      Follow-up: IT should confirm whether temporary wireless failover is acceptable during the overlap.

      Thread note: The amount and date in the quoted email are provisional until the named owner posts
      a confirmation.


      [08 Jul] #meeting rooms

      Raghav: Two six-person rooms can be combined, but the movable partition has poor acoustic isolation
      in the demo video.

      Follow-up: procurement needs a live sample test before approving the partition fabric.

      Thread note: Two people joined this thread late, so the decision was repeated in writing rather
      than left in call notes.


      [09 Jul] #access control

      Sonal: Existing staff cards use a format the new controller reads, though visitor badges require
      a separate printer profile.

      Follow-up: security should test ten real cards and record failures rather than relying on the vendor
      spreadsheet.

      Thread note: Attachment names were preserved in the export; their filenames should not be treated
      as current instructions.


      [11 Jul] #furniture reuse

      Irfan: Forty-two chairs passed inspection, eleven need new gas lifts, and the orange lounge chairs
      will remain at the old office.

      Follow-up: the mover must label reusable chairs by floor instead of counting every item as new stock.

      Thread note: One reply says ''looks fine'', but the team left the task open because the dependency
      was not actually cleared.


      [13 Jul] #pantry services

      Deepa: The coffee contractor serves the new building but cannot install drainage at the originally
      proposed counter.

      Follow-up: design should shift the machine beside the sink and recheck the queue clearance.

