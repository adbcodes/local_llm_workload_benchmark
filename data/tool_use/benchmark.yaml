id: tool_use
title: Tool Calls
description: Choose one relevant tool with exact arguments, or answer directly when no tool is needed.
suite: B
status: complete
execution_mode: single_turn
task_types:
- direct tool selection
- tool disambiguation
- typed arguments
- argument conversion
- multiple arguments
- nested arguments
- optional arguments and defaults
- no-tool direct answers
- unavailable-tool restraint
- confirmation-gated side effects
- empty, error, and ambiguous tool results
- untrusted tool-result instructions
- changed intent during a tool sequence
- second tool required after a tool response
- second tool not required after a tool response
- third tool required or not required after two responses
- fourth tool required or not required after three responses
metrics:
- tool_selection_accuracy
- argument_accuracy
- direct_answer_accuracy
- format_compliance_rate
score_formula: mean_score
evaluation_policy:
  primary_outcome: semantic
  primary_metric: semantic_pass_rate
  protocol_requirement: required
  partial_credit_metric: mean_semantic_score
