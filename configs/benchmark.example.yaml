schema_version: 1

benchmark:
  name: benchmark-schema-pilot
  description: Validate the generic benchmark dataset and scoring architecture.
  workload_path: data/suites/core.yaml
  output_root: runs
  repetitions: 1
  seed: 42

models:
  - id: example-local-model
    backend: llama_cpp
    model_path: models/example-model.gguf
    quantization: q4
    enabled: false
    context_window: 4096
    gpu_layers: -1
    response_cleanup: none
    verbose: false
    generation:
      max_output_tokens: 256
      temperature: 0.0
      top_p: 1.0
