schema_version: 1

benchmark:
  name: qwen3-8b-runtime-matrix
  description: Full benchmark factorial across four quantizations and sampler settings.
  workload_path: data/suites/all.yaml
  output_root: runs
  repetitions: 1
  seed: 42

model:
  backend: llama_cpp
  architecture: qwen3-8b
  family: qwen
  context_window: 16384
  gpu_layers: -1
  threads: null
  batch_size: 512
  flash_attention: true
  kv_cache_type: null
  response_cleanup: strip_think
  verbose: false
  system_prompt: |-
    /no_think
    Follow the user's instructions precisely. Return only the requested answer without commentary.

quantizations:
  - id: qwen3-8b-q8
    quantization: Q8_0
    model_path: models/Qwen3-8B-Q8_0.gguf
  - id: qwen3-8b-q6
    quantization: Q6_K
    model_path: models/Qwen3-8B-Q6_K.gguf
  - id: qwen3-8b-q4
    quantization: Q4_K_M
    model_path: models/Qwen3-8B-Q4_K_M.gguf
  - id: qwen3-8b-q3
    quantization: Q3_K_M
    model_path: models/Qwen3-8B-Q3_K_M.gguf

axes:
  temperature: [0.0, 0.7]
  top_p: [1.0]
  top_k: [40]
  repeat_penalty: [1.0, 1.1]
  max_output_tokens: [512]
  constrained_decoding: [none, json_when_requested]
  context_window: [16384]
  threads: [null]
  batch_size: [512]
  gpu_layers: [-1]
  flash_attention: [true]
  kv_cache_type: [null]

judge:
  provider: groq
  model: openai/gpt-oss-120b
  family: openai
  api_key_env: GROQ_API_KEY
  reasoning_effort: medium
  max_completion_tokens: 4096
  timeout_seconds: 60
  max_retries: 3
  rate_limit_cooldown_retries: 1
  rate_limit_fallback_wait_seconds: 60
  rate_limit_max_wait_seconds: 3600
  max_candidate_characters: 12000
  cache_path: runs/judge_cache.jsonl
  input_price_per_million_tokens: 0.15
  cached_input_price_per_million_tokens: 0.075
  output_price_per_million_tokens: 0.60
