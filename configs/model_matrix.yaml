schema_version: 1

benchmark:
  name: three-model-pilot
  description: Compare all available local GGUF models on the fixed pilot suite.
  workload_path: data/benchmarks/v1/suite.yaml
  output_root: runs
  repetitions: 1
  seed: 42

models:
  - id: qwen2.5-3b-q4
    backend: llama_cpp
    model_path: models/qwen2.5-3b-instruct-q4_k_m.gguf
    quantization: Q4_K_M
    enabled: true
    context_window: 4096
    gpu_layers: -1
    generation:
      max_output_tokens: 256
      temperature: 0.0
      top_p: 1.0

  - id: gemma-3-4b-q4
    backend: llama_cpp
    model_path: models/gemma-3-4b-it-Q4_K_M.gguf
    quantization: Q4_K_M
    enabled: true
    context_window: 4096
    gpu_layers: -1
    generation:
      max_output_tokens: 256
      temperature: 0.0
      top_p: 1.0

  - id: qwen3-8b-q4
    backend: llama_cpp
    model_path: models/Qwen3-8B-Q4_K_M.gguf
    quantization: Q4_K_M
    enabled: true
    context_window: 4096
    gpu_layers: -1
    response_cleanup: strip_empty_think
    system_prompt: |-
      /no_think
      Follow the user's instructions precisely. Return only the requested answer without commentary.
    generation:
      max_output_tokens: 256
      temperature: 0.0
      top_p: 1.0
